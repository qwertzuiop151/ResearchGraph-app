        <div class="help">A <b>fine-grained</b> token with <b>Issues: write</b> on <b>${esc(FB_REPO)}</b> only — nothing more. It is stored only in this browser, never in this file, so a leaked token could at most open issues in that one repository. The gist token cannot do this.</div></div>`
        :`<div class="fld"><button class="lbtn" style="margin-left:-6px" data-act="fbTok">GitHub token for feedback…</button></div>`}
      ${d.msg?`<div class="fld"><div class="${d.ok?'ok':'err'}">${esc(d.msg)}</div></div>`:''}
      <div class="acts"><button class="btn l" data-act="fbCopy" title="No token or no network? Copy the report and paste it into GitHub yourself">Copy text</button><button class="btn" data-act="closeDialog">Cancel</button><button class="btn primary" data-act="fbSend"${d.busy?' disabled':''}>${d.busy?'Sending…':'Send'}</button></div>`;
  }else if(d.type==='jwrite'){
    wide=true;
    inner=`<h2>Journal entry · ${esc(projById(d.pid)?.name||'')}</h2><p>Goes into the day you pick, next to what your agent wrote there.</p>
      <div class="fld" style="display:flex;gap:10px"><div style="flex:0 0 auto"><label for="jwd">Day</label><input id="jwd" type="date" data-in="dlg" data-name="date" value="${esc(d.date||'')}" style="width:auto"></div><div style="flex:1"><label for="jwt">Title</label><input id="jwt" type="text" data-in="dlg" data-name="title" value="${esc(d.title||'')}" placeholder="e.g. Colony PCR pDC135" autocomplete="off"></div></div>
      <div class="fld"><label for="jwc">Text</label><textarea id="jwc" rows="9" data-in="dlg" data-name="content" style="font:13px/1.5 var(--mono)" placeholder="What happened, what you saw, what comes next">${esc(d.content||'')}</textarea><div class="help">Markdown works: **bold**, lists, tables. Ctrl+Enter saves.</div>${d.err?`<div class="err">${esc(d.err)}</div>`:''}</div>
      <div class="acts"><button class="btn" data-act="closeDialog">Cancel</button><button class="btn primary" data-act="jsave">Save to journal</button></div>`;
  }else if(d.type==='archive'){
    const what={todo:'task',step:'step',idea:'idea',cal:'calendar entry'}[d.kind];
    inner=`<h2>Archive this ${what}?</h2><p>“${esc(snip(d.label,90))}” ${d.kind==='cal'?'leaves the calendar':'leaves the lists'} but is kept exactly as it is${d.kind==='todo'?', with all its steps and which of them are done':''}. ${d.kind==='cal'?'“archived” at the top of the calendar':'⋯ → Archived items'} brings it back.</p>
      <div class="fld"><label for="arr">Why? (optional)</label><input id="arr" type="text" data-in="dlg" data-name="reason" value="${esc(d.reason||'')}" placeholder="e.g. replaced by the Gibson route" autocomplete="off"></div>
      <div class="acts"><button class="btn" data-act="closeDialog">Cancel</button><button class="btn primary" data-act="doArchive">Archive ${what}</button></div>`;
  }else if(d.type==='fail'){
    const what=d.kind==='todo'?'task':'step';
    inner=`<h2>Mark this ${what} as failed?</h2><p>“${esc(snip(d.label,90))}” ${d.kind==='todo'?'moves to Closed, marked ✕ instead of ✓, with all its steps exactly as they are':'stays in its task, marked ✕ instead of ✓'}. Any other status can be set again later.</p>
      <div class="fld"><label for="flr">Why did it fail?</label><input id="flr" type="text" data-in="dlg" data-name="reason" value="${esc(d.reason||'')}" placeholder="${d.kind==='todo'?'e.g. no colonies after two attempts':'e.g. no band on the gel'}" autocomplete="off"></div>
      <div class="acts"><button class="btn" data-act="closeDialog">Cancel</button><button class="btn primary" data-act="doFail">Mark as failed</button></div>`;
  }else if(d.type==='calnew'){
    // Ein Fenster, alles drin: Titel, von/bis (Tag + Uhrzeit), Ort, Beschreibung. Enter legt an, Esc bricht ab.
    inner=`<h2>New calendar entry</h2>
      <div class="fld"><label for="cnt">Title</label><input id="cnt" type="text" data-in="dlg" data-name="title" value="${esc(d.title||'')}" placeholder="e.g. Seminar" autocomplete="off"></div>
      <div class="fld cn-when"><label for="cnsd">From</label><input id="cnsd" type="date" data-in="dlg" data-name="sd" value="${esc(d.sd||'')}" aria-label="First day"><input id="cnst" type="time" data-in="dlg" data-name="st" value="${esc(d.st||'')}" aria-label="Start time">
        <label for="cned">To</label><input id="cned" type="date" data-in="dlg" data-name="ed" value="${esc(d.ed||'')}" aria-label="Last day"><input id="cnet" type="time" data-in="dlg" data-name="et" value="${esc(d.et||'')}" aria-label="End time">
        <div class="help">Leave the times empty for an all-day entry. A start time without an end lasts one hour.</div></div>
      <div class="fld"><label for="cnl">Where</label><input id="cnl" type="text" data-in="dlg" data-name="location" value="${esc(d.location||'')}" placeholder="e.g. Seminar room 2" autocomplete="off"></div>
      <div class="fld"><label for="cnd">Description</label><textarea id="cnd" rows="3" data-in="dlg" data-name="description" placeholder="Optional — Markdown works">${esc(d.description||'')}</textarea>${d.err?`<div class="err">${esc(d.err)}</div>`:''}</div>
      <div class="acts"><button class="btn" data-act="closeDialog">Cancel</button><button class="btn primary" data-act="calSave">Add entry</button></div>`;
  }else if(d.type==='carch'){
    const L=calEvents(true).filter(x=>x.src==='own'&&isArch(x.ev)).map(x=>x.ev).sort((a,b)=>String(b.archivedAt||'').localeCompare(String(a.archivedAt||'')));
    inner=`<h2>Archived calendar entries</h2><p>Nothing is ever deleted. Click an entry to read it; Restore puts it back into the calendar.</p>
      ${L.length?`<div class="alist">${L.map(e=>`<div class="arow"><button class="x lbtn" data-act="open" data-type="cal" data-pid="own" data-id="${esc(e.id)}">${esc(e.title||'(no title)')} <span class="ro">· ${esc(calWhen(e))}</span><small>${esc(fmtDT(e.archivedAt))}${e.archivedReason?' — '+esc(e.archivedReason):''}</small></button><button class="lbtn" data-act="restore" data-kind="cal" data-id="${esc(e.id)}">Restore</button></div>`).join('')}</div>`:'<p class="ro" style="margin-top:10px">Nothing archived.</p>'}
      <div class="acts"><button class="btn primary" data-act="closeDialog">Close</button></div>`;
  }else if(d.type==='parch'){
    wide=true;const p=projById(d.pid),dd=S.data[d.pid];
    const meta=x=>`<small>${esc(fmtDT(x.archivedAt))}${x.archivedReason?' — '+esc(x.archivedReason):''}</small>`;
    const row=(open,label,x,restore)=>`<div class="arow"><button class="x lbtn" ${open}>${label}${meta(x)}</button>${restore?`<button class="lbtn" ${restore}>Restore</button>`:''}</div>`;
    const pa=`data-pid="${esc(d.pid)}"`;
    const T=dd.todos.filter(isArch).sort((a,b)=>String(b.archivedAt||'').localeCompare(String(a.archivedAt||'')));
    const St=[];dd.todos.forEach(t=>{if(!isArch(t))(t.subtasks||[]).filter(isArch).forEach(s=>St.push({t,s}));});
    const I=dd.ideas.filter(isArch),E=dd.elements.filter(isArch);
    const grp=(title,rows)=>rows.length?`<div class="agrp">${title} (${rows.length})</div><div class="alist">${rows.join('')}</div>`:'';
    inner=`<h2>Archived in ${esc(p?p.name:'')}</h2><p>Nothing is ever deleted. Click an entry to read it; Restore puts it back into the lists.</p>
      ${grp('Tasks',T.map(t=>{const n=(t.subtasks||[]).length,dn=(t.subtasks||[]).filter(s=>sSt(s)==='done').length;return row(`data-act="open" data-type="todo" ${pa} data-id="${esc(t.id)}"`,esc(t.text||'Untitled task')+` <span class="ro">· ${esc(tSt(t).replace('_',' '))}${n?` · ${dn}/${n} steps done`:''}</span>`,t,`data-act="restore" data-kind="todo" ${pa} data-id="${esc(t.id)}"`);}))}
      ${grp('Steps',St.map(({t,s})=>row(`data-act="open" data-type="step" ${pa} data-id="${esc(t.id)}" data-sid="${esc(s.id)}"`,mark(sSt(s))+' '+esc(s.text)+` <span class="ro">· in “${esc(snip(t.text,50))}”</span>`,s,`data-act="restore" data-kind="step" ${pa} data-id="${esc(t.id)}" data-sid="${esc(s.id)}"`)))}
      ${grp('Ideas',I.map(i=>row(`data-act="open" data-type="idea" ${pa} data-id="${esc(i.id)}"`,esc(i.title||'Untitled idea'),i,`data-act="restore" data-kind="idea" ${pa} data-id="${esc(i.id)}"`)))}
      ${grp('Elements (archived by your agent)',E.map(e=>row(`data-act="open" data-type="element" ${pa} data-id="${esc(e.id)}"`,esc(e.label),e,'')))}
      ${T.length+St.length+I.length+E.length?'':'<p class="ro" style="margin-top:10px">Nothing archived yet.</p>'}
      <div class="acts"><button class="btn primary" data-act="closeDialog">Close</button></div>`;
  }else if(d.type==='help'){
    wide=true;
    inner=`<h2>How ResearchGraph works</h2><ul class="hl">
      <li>Every active project is a column. Drag the thin line between two columns to change their width.</li>
      <li>The box in front of a task or step shows its status: empty = open, dot = in progress, stroke = blocked, tick = done, cross = failed. Click it and pick the new status right below — in any direction. Blocked tasks show what they wait for.</li>
      <li>Something that did not work is set to <b>failed</b>; the app asks why, and the reason stays with it. Steps and tasks work the same way.</li>
      <li>A task you set to done or failed moves to <b>Closed</b> at the bottom of its project. Click “Closed” to see them, newest first; the box brings one back.</li>
      <li>Search looks through everything — tasks (also closed and archived ones), ideas, elements with their activity, every journal section. The numbers next to Tasks / Board / Journal show where the matches are.</li>
      <li>The bars after a title show the priority: one bar low, two medium, three high. Click the first, second or third bar to set it. ★ marks the focus task and the focus step.</li>
      <li>Hover a task and click ＋ to add a step right there.</li>
      <li>A task or step with a due date carries a mark in its row: the date in yellow while it is far off, “in 3 d” in orange once it comes close, “today” and “2 d late” in dark red. How many days before it turns orange you choose next to the date in the details (3 days unless you say otherwise).</li>
      <li>Click a title to open details on the right: status, priority, focus, steps, notes. The chip after a title is the linked element.</li>
      <li>Ctrl+Z undoes your last change, again and again; Ctrl+Y brings it back.</li>
      <li>❄ Freeze a project (column menu ⋯) to hide it until you have time again; archive it when it is finished.</li>
      <li>Nothing is deleted. A task, step or idea you no longer need is archived (in its details, with an optional reason) and stays readable under ⋯ → Archived items, every step exactly as it was.</li>
      <li><b>Calendar</b> shows everything that has a date, week under week without an end: what is due, what was done or failed, the days with a journal entry, which elements had activity and new ideas. Scroll up or down as far as you like; a line marks where a month begins, ‹ › jump a month and Today brings you back. Click any entry to open it. Appointments from your Google Calendar (marked G) and your own calendar entries (marked C) appear there too; click one for its details — time, place, description. Add an entry with “＋ New entry” or the ＋ in a day: one small window takes title, day, time, place and description; without a time it lasts all day. Own entries can be changed and archived here or by your agent; Google goes one way only, nothing is sent back.</li>
      <li>Board shows what your agent keeps — read-only here. In Journal you can write an entry yourself (＋ Write a journal entry); it goes next to your agent’s.</li>
      <li>The app stays in sync on its own: it checks GitHub every ${Math.round(T.poll/1000)} seconds and merges your changes with your agent’s, so nothing is overwritten.</li></ul>
      <div class="acts"><button class="btn primary" data-act="closeDialog">Close</button></div>`;
  }
  return `<div class="dscrim" data-k="dlg-${esc(d.type)}" data-act="dscrim"><div class="dlg${wide?' wide':''}" role="dialog" aria-modal="true">${inner}</div></div>`;
}

// 11. AKTIONEN — Datenaenderungen nur ueber change()/changeProject()/addProject()
// ════════════════════════════════════════════════════════════════════════════
function setStepSt(s,st,reason){s.status=st;if(st==='failed'){s.failedAt=nowIso();s.failedReason=String(reason||'').trim()||null;}else{delete s.failedAt;delete s.failedReason;}}
function setTodoStatus(t,st,reason){
  const now=nowIso(),was=tSt(t);t.status=st;
  if(st==='done'&&was!=='done')t.completedAt=now;
  if(st!=='done')t.completedAt=null;
  if(st==='failed'){t.failedAt=now;t.failedReason=String(reason||'').trim()||null;}else{delete t.failedAt;delete t.failedReason;}
  if(st!=='blocked')t.blockedBy=null;
  t.modifiedAt=now;
}
// Vorlauf (Tage vor dem Datum, ab denen die Marke orange wird) an Task oder Schritt setzen
function setWarn(a,raw){
  const n=Math.round(+raw);if(!Number.isFinite(n)||n<0||n>365||String(raw).trim()===''){render();return;}
  const x=a.sid?findS(a.pid,a.id,a.sid):findT(a.pid,a.id);if(!x||warnOf(x)===n&&x.dueWarnDays!==undefined){render();return;}
  change(a.pid,d=>{x.dueWarnDays=n;d.todos.find(t=>t.id===a.id).modifiedAt=nowIso();});
}
function setFocus(d,t,on){
  const now=nowIso();
  if(on)d.todos.forEach(x=>{if((x.focus||x.northStar)&&x!==t){x.focus=false;if('northStar' in x)delete x.northStar;x.modifiedAt=now;}});
  t.focus=!!on;if('northStar' in t)delete t.northStar;
  d.todos.forEach(x=>{if(!x.focus)(x.subtasks||[]).forEach(s=>{if(s.focus)s.focus=false;});}); // Focus-Step nur im Focus-Task
  t.modifiedAt=now;
}
const A=el=>el.dataset;
function openDrawer(dr){commitDraft();ui.drawer=dr;ui.menu=null;render();}
const ACT={
  page:el=>{commitDraft();ui.page=A(el).v;ui.drawer=null;localStorage.setItem('rg3_page',ui.page);render();},
  clearQ:()=>{ui.q='';render();},
  toggleDone:()=>{ui.hideDone=!ui.hideDone;localStorage.setItem('rg_hideDoneSubtasks',ui.hideDone?'1':'');render();},
  toggleFrozen:()=>{ui.showFrozen=!ui.showFrozen;render();},
  theme:()=>{const t=isDark()?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('rg3_theme',t);}catch(e){}render();},
  zoom:el=>{ui.zoom=Math.max(60,Math.min(160,ui.zoom+(+A(el).v)));localStorage.setItem('rg3_zoom',ui.zoom);render();},
  menu:el=>{ui.menu=ui.menu===A(el).v?null:A(el).v;render();},
  closeToast:()=>{ui.toast=null;render();},
  mode:el=>{ui.mode=A(el).v;localStorage.setItem('rg3_mode',ui.mode);render();},
  pickOne:el=>{ui.one=A(el).pid;localStorage.setItem('rg3_one',ui.one);render();},
  solo:el=>{ui.one=A(el).pid;ui.mode='one';localStorage.setItem('rg3_one',ui.one);localStorage.setItem('rg3_mode','one');render();},
  collapse:el=>{ui.collapsed.add(A(el).pid);lsSet('rg3_collapsed',[...ui.collapsed]);render();},
  expand:el=>{ui.collapsed.delete(A(el).pid);lsSet('rg3_collapsed',[...ui.collapsed]);render();},
  fold:el=>{const a=A(el),k=a.pid+'|'+a.id;if(ui.folded.has(k))ui.folded.delete(k);else ui.folded.add(k);lsSet('rg3_folded',[...ui.folded]);render();},
  expandAll:()=>{ui.collapsed.clear();lsSet('rg3_collapsed',[]);render();},
  resetWidths:()=>{ui.colw={};lsSet('rg3_colw',{});ui.menu=null;render();},
  // Tasks
  // Kaestchen: klappt die Status-Auswahl dieser Zeile auf/zu (kein Klick-Zyklus mehr — der fuehrte nur vorwaerts und liess Tasks spurlos verschwinden)
  pickSt:el=>{ui.pick=ui.pick===A(el).v?null:A(el).v;ui.menu=null;render();},
  // ‹ › springen zum Anfang des Monats davor/danach (vom Monat im Kopf aus gerechnet), Today zur aktuellen Woche — das Band selbst laeuft durch
  calNav:el=>{const v=+A(el).v;if(!v)return calGoto(todayStr());const s=dAdd(calTop(),6),d=new Date(+s.slice(0,4),+s.slice(5,7)-1+v,1,12);calGoto(d.toLocaleDateString('en-CA'));},
  toggleClosed:el=>{const pid=A(el).pid;if(qq())return;if(ui.closedOpen.has(pid))ui.closedOpen.delete(pid);else ui.closedOpen.add(pid);lsSet('rg3_closed',[...ui.closedOpen]);render();},
  open:el=>{const a=A(el);if(ui.dialog&&(ui.dialog.type==='parch'||ui.dialog.type==='carch')){ui.dialog=null;ui.stack=[];}openDrawer({type:a.type,pid:a.pid,id:a.id,sid:a.sid});},
  closeDrawer:()=>{commitDraft();ui.drawer=null;render();},
  setStatus:el=>{
    const a=A(el),t=findT(a.pid,a.id),v=a.v,inRow=!!el.closest('.stpick');ui.pick=null;
    if(!t||rawSt(t)===v){render();return;}
    if(v==='failed'){openDialog({type:'fail',kind:'todo',pid:a.pid,id:a.id,label:t.text,reason:''});ui.focusSel='#flr';return;} // erst nach dem Grund fragen
    change(a.pid,()=>setTodoStatus(t,v));
    if(v==='blocked'){if(inRow&&!isOpen('todo',a.pid,a.id))openDrawer({type:'todo',pid:a.pid,id:a.id});ui.focusSel='textarea[data-key^="todo.blockedBy"]';render();} // der Wartegrund steht in der Schublade
    else if(v==='done')toast('Done: “'+snip(t.text,60)+'” — now under Closed in '+(projById(a.pid)?.name||'its project')+'. Ctrl+Z undoes.');
  },
  setPrio:el=>{const t=findT(A(el).pid,A(el).id);if(!t||tPr(t)===A(el).v)return;change(A(el).pid,()=>{t.priority=A(el).v;t.modifiedAt=nowIso();});},
  setCat:el=>{const t=findT(A(el).pid,A(el).id);if(!t||tCat(t)===A(el).v)return;/* exakt: altes 'general' -> 'General' darf umschreiben */change(A(el).pid,()=>{t.category=A(el).v;t.modifiedAt=nowIso();});},
  toggleFocus:el=>{const pid=A(el).pid,t=findT(pid,A(el).id);if(!t)return;const on=focusOf(S.data[pid])?.id!==t.id;change(pid,d=>setFocus(d,t,on));},
  setStepStatus:el=>{const s=findS(A(el).pid,A(el).id,A(el).sid);ui.pick=null;if(!s||(s.status||'open')===A(el).v){render();return;}
    if(A(el).v==='failed'){openDialog({type:'fail',kind:'step',pid:A(el).pid,id:A(el).id,sid:A(el).sid,label:s.text,reason:''});ui.focusSel='#flr';return;}
    change(A(el).pid,d=>{setStepSt(s,A(el).v);d.todos.find(x=>x.id===A(el).id).modifiedAt=nowIso();});},
  doFail:()=>{
    const g=ui.dialog;if(!g||g.type!=='fail')return;ui.dialog=null;
    if(g.kind==='todo'){const t=findT(g.pid,g.id);if(!t){render();return;}change(g.pid,()=>setTodoStatus(t,'failed',g.reason));toast('Failed: “'+snip(t.text,60)+'” — now under Closed in '+(projById(g.pid)?.name||'its project')+'. Ctrl+Z undoes.');}
    else{const s=findS(g.pid,g.id,g.sid);if(!s){render();return;}change(g.pid,d=>{setStepSt(s,'failed',g.reason);d.todos.find(x=>x.id===g.id).modifiedAt=nowIso();});}
  },
  toggleStepFocus:el=>{const a=A(el),t=findT(a.pid,a.id),s=findS(a.pid,a.id,a.sid);if(!t||!s)return;const was=!!s.focus;change(a.pid,()=>{(t.subtasks||[]).forEach(x=>{if(x.focus)x.focus=false;});s.focus=!was;t.modifiedAt=nowIso();});},
  clearDue:el=>{const t=findT(A(el).pid,A(el).id);if(t)change(A(el).pid,()=>{t.dueDate=null;delete t.dueWarnDays;t.modifiedAt=nowIso();});},
  clearDueStep:el=>{const a=A(el),s=findS(a.pid,a.id,a.sid);if(s)change(a.pid,d=>{s.dueDate=null;delete s.dueWarnDays;d.todos.find(x=>x.id===a.id).modifiedAt=nowIso();});},
  setWarn:el=>setWarn(A(el),A(el).v),
  pickEl:el=>openDialog({type:'pick',pid:A(el).pid,target:{id:A(el).id},q:''}),
  pickElStep:el=>openDialog({type:'pick',pid:A(el).pid,target:{id:A(el).id,sid:A(el).sid},q:''}),
  unlink:el=>{const t=findT(A(el).pid,A(el).id);if(t)change(A(el).pid,()=>{t.elementId=null;t.modifiedAt=nowIso();});},
  unlinkStep:el=>{const a=A(el),s=findS(a.pid,a.id,a.sid);if(s)change(a.pid,d=>{s.elementId=null;d.todos.find(x=>x.id===a.id).modifiedAt=nowIso();});},
  pickItem:el=>{const d=ui.dialog;ui.dialog=null;const tg=d.target;if(tg.sid){const s=findS(d.pid,tg.id,tg.sid);if(s)change(d.pid,dd=>{s.elementId=A(el).id;dd.todos.find(x=>x.id===tg.id).modifiedAt=nowIso();});}else{const t=findT(d.pid,tg.id);if(t)change(d.pid,()=>{t.elementId=A(el).id;t.modifiedAt=nowIso();});}},
  // Archivieren statt Loeschen: Task (mit allen Schritten, wie sie sind), Schritt, Idee
  archiveAsk:el=>{const a=A(el);const x=a.kind==='cal'?findCalEv('own',a.id):a.kind==='todo'?findT(a.pid,a.id):a.kind==='step'?findS(a.pid,a.id,a.sid):S.data[a.pid]?.ideas.find(i=>i.id===a.id);if(!x)return;openDialog({type:'archive',kind:a.kind,pid:a.pid,id:a.id,sid:a.sid,label:a.kind==='idea'||a.kind==='cal'?x.title:x.text,reason:''});ui.focusSel='#arr';},
  doArchive:()=>{const g=ui.dialog;if(!g||g.type!=='archive')return;ui.dialog=null;ui.edit=null;archiveItem(g.kind,g.pid,g.id,g.sid,true,g.reason);},
  restore:el=>{const a=A(el);archiveItem(a.kind,a.pid,a.id,a.sid,false);},
  startAdd:el=>{ui.adding=ui.adding===A(el).v?null:A(el).v;ui.focusSel='.add-in';render();},
  // Kalender: Eintrag fuer heute anlegen (Zeile im heutigen Tag), ganztaegig <-> mit Uhrzeit, archivierte Eintraege
  // ＋ (im Kopf: heute, im Tag: dieser Tag) oeffnet EIN kleines Fenster, in dem alles Wichtige steht — Titel, Tag, Uhrzeit, Ort, Beschreibung.

function archiveItem(kind,pid,id,sid,on,reason){
  const now=nowIso();
  if(kind==='todo'){const t=findT(pid,id);if(!t||isArch(t)===on)return;change(pid,d=>{setArchived(t,on,reason);if(on&&(t.focus||t.northStar))setFocus(d,t,false);t.modifiedAt=now;});if(on&&ui.drawer&&ui.drawer.id===id)ui.drawer=null;}
  else if(kind==='step'){const t=findT(pid,id),s=findS(pid,id,sid);if(!t||!s||isArch(s)===on)return;change(pid,()=>{setArchived(s,on,reason);if(on)s.focus=false;t.modifiedAt=now;});if(on&&ui.drawer&&ui.drawer.sid===sid)ui.drawer={type:'todo',pid,id};}
  else if(kind==='idea'){const i=S.data[pid]?.ideas.find(x=>x.id===id);if(!i||isArch(i)===on)return;change(pid,()=>{setArchived(i,on,reason);i.modifiedAt=now;});if(on&&ui.drawer&&ui.drawer.id===id)ui.drawer=null;}
  else if(kind==='cal'){const ev=findCalEv('own',id);if(!ev||isArch(ev)===on)return;changeCal(()=>{setArchived(ev,on,reason);ev.modifiedAt=now;});if(on&&ui.drawer&&ui.drawer.type==='cal'&&ui.drawer.id===id)ui.drawer=null;
    render();toast(on?'Archived — “archived” at the top of the calendar keeps it. Ctrl+Z undoes.':'Restored. Ctrl+Z undoes.');return;}
  render();toast(on?'Archived — ⋯ → Archived items keeps it. Ctrl+Z undoes.':'Restored. Ctrl+Z undoes.');
}
function handleAdd(inp){
  const text=inp.value.trim();if(!text)return;
  const a=inp.dataset,now=nowIso();inp.value='';
  if(a.add==='todo'){const d=S.data[a.pid];change(a.pid,dd=>{dd.todos.push({id:_uid('t'),text,notes:'',status:'open',category:a.cat,order:d.todos.length,subtasks:[],priority:'low',focus:false,dueDate:null,elementId:null,blockedBy:null,completedAt:null,createdAt:now,modifiedAt:now});});}
  else if(a.add==='idea')change(a.pid,dd=>{dd.ideas.push({id:_uid('idea'),title:text,desc:'',elementId:null,createdAt:now});});
  else if(a.add==='step'){const t=findT(a.pid,a.id);if(t)change(a.pid,()=>{if(!Array.isArray(t.subtasks))t.subtasks=[];t.subtasks.push({id:_uid('st'),text,notes:'',status:'open',focus:false,dueDate:null,elementId:null});t.modifiedAt=now;});}
}

document.addEventListener('keydown',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in,mod=ev.ctrlKey||ev.metaKey;
  if(k==='draft'){if(mod&&ev.key==='Enter'){ev.preventDefault();commitDraft();}else if(ev.key==='Escape'&&ui.edit&&ui.edit.value===ui.edit.orig){ev.preventDefault();ui.edit=null;render();}return;}
  if(k==='title'){if(ev.key==='Enter'){ev.preventDefault();t.blur();}else if(ev.key==='Escape'){ev.preventDefault();const x=_f(t.dataset.key);t.value=x?String(x.f.get(x.args)||''):t.value;t.blur();}return;}
  if(t.dataset&&t.dataset.add){if(ev.key==='Enter'){ev.preventDefault();handleAdd(t);}else if(ev.key==='Escape'){ui.adding=null;t.blur();render();}return;}
  if(ui.dialog){
    if(ev.key==='Escape'){ev.preventDefault();closeDialog();return;}
    if(mod&&ev.key==='Enter'&&ui.dialog.type==='jwrite'){ev.preventDefault();ACT.jsave();return;}
    if(mod&&ev.key==='Enter'&&ui.dialog.type==='calnew'){ev.preventDefault();ACT.calSave();return;}
    if(ev.key==='Enter'&&ui.dialog.type==='jwrite'&&t.tagName==='INPUT'){ev.preventDefault();return;} // Enter im Titel speichert nicht halbfertig
    if(ev.key==='Enter'&&t.tagName==='INPUT'){ev.preventDefault();const d=ui.dialog;if(d.type==='project')ACT.saveProject();else if(d.type==='list')ACT.saveList();else if(d.type==='archive')ACT.doArchive();else if(d.type==='calnew')ACT.calSave();else if(d.type==='fail')ACT.doFail();else if(d.type==='sync'&&!ghToken)ACT.connect();else if(d.type==='pick'){const f=document.querySelector('.pick button');if(f)f.click();}}
    return;
  }
  // Strg+Z / Strg+Y (Strg+Umschalt+Z) ueberall — nur in Textfeldern bleibt es das Rueckgaengig des Browsers fuer den Text
  if(mod&&!ev.altKey&&/^[zy]$/i.test(ev.key)){
    if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)return;
    ev.preventDefault();undoRedo(ev.key.toLowerCase()==='y'||ev.shiftKey?'redo':'undo');return;
  }
  if(ev.key==='Escape'){if(ui.pick){ui.pick=null;render();}else if(ui.menu){ui.menu=null;render();}else if(ui.drawer){commitDraft();ui.drawer=null;render();}else if(k==='q'){ui.q='';t.blur();render();}return;}
  if(mod&&ev.key.toLowerCase()==='f'){ev.preventDefault();const s=document.querySelector('.search input');if(s){s.focus();s.select();}}
});

function _splitCols(sp){const q=id=>document.querySelector('.col[data-col="'+CSS.escape(id)+'"]');return [q(sp.dataset.split),q(sp.dataset.right)];}
function _freezeWeights(z){document.querySelectorAll('.board .col[data-col]').forEach(c=>{const w=c.getBoundingClientRect().width/z;if(w>0)ui.colw[c.dataset.col]=Math.round(w);});}
document.addEventListener('pointerdown',ev=>{
  const sp=ev.target.closest&&ev.target.closest('.split');if(!sp)return;
  const [a,b]=_splitCols(sp);if(!a||!b)return;
  ev.preventDefault();sp.classList.add('drag');
  const z=ui.zoom/100,startX=ev.clientX;_freezeWeights(z);
  const A=sp.dataset.split,B=sp.dataset.right,wa=ui.colw[A],sum=wa+ui.colw[B],MIN=240;
  document.querySelectorAll('.board .col[data-col]').forEach(c=>{c.style.flex=ui.colw[c.dataset.col]+' 1 0';});
  const mv=e=>{const na=Math.min(sum-MIN,Math.max(MIN,Math.round(wa+(e.clientX-startX)/z)));ui.colw[A]=na;ui.colw[B]=sum-na;a.style.flex=na+' 1 0';b.style.flex=(sum-na)+' 1 0';};
  const up=()=>{sp.classList.remove('drag');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);lsSet('rg3_colw',ui.colw);render();};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
});
