<!DOCTYPE html>
<!-- ResearchGraph v3 (ab 19.10.2026): Uebersicht aller Projekte als Spalten, gebaut nach den Kriterien aus docs/ResearchGraph_Anforderungen-Interview_2026-10.md; Live-Sync Variante A aus docs/ResearchGraph_Sync-Recherche_2026-10.md. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>ResearchGraph</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23172033'/><text x='16' y='23' text-anchor='middle' font-size='19' font-family='Segoe UI,sans-serif' font-weight='700' fill='white'>R</text></svg>">
<style>
/* Tinte/Papier-Neutrale + Okabe-Ito. Bedeutung immer ueber Form/Text, Farbe nur zweiter Kanal (Rot-Gruen-Schwaeche). */
:root{
  --ink:#172033;--ink-2:#364153;--ink-3:#5A6475;--ink-4:#858E9C;
  --paper:#FFFFFF;--bg:#EEF0F4;--rule:#DCE0E6;--rule-2:#C5CCD6;--hover:#EEF1F5;--sel:#DFE6F0;
  --done:#0072B2;--prog:#E69F00;--prog-ink:#7A4100;--danger:#B23A00;
  --ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --read:"Sitka Text",Georgia,serif;--mono:"Cascadia Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.4 var(--ui);color:var(--ink);background:var(--bg);overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;text-align:left}
:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#app{height:100vh;display:flex;flex-direction:column}

/* ── Kopfzeile ── */
.top{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--paper);border-bottom:1px solid var(--rule);flex-shrink:0;flex-wrap:wrap}
.brand{font-weight:700;font-size:14px;margin-right:6px}
.nav{display:inline-flex;gap:2px}
.nav button{padding:4px 10px;border-radius:6px;color:var(--ink-2)}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--ink);color:#fff;font-weight:600}
.nav button.minor{font-size:12.5px}
.grow{flex:1}
.search{position:relative}
.search input{width:220px;padding:4px 26px 4px 8px;border:1px solid var(--rule-2);border-radius:6px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--ink)}
.search button{position:absolute;right:3px;top:2px;padding:1px 5px;color:var(--ink-3)}
.tbtn{padding:4px 9px;border-radius:6px;border:1px solid var(--rule-2);background:var(--paper);white-space:nowrap;color:var(--ink-2)}
.tbtn:hover{border-color:var(--ink-3);color:var(--ink)}
.tbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.zoom{display:inline-flex;align-items:center;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden;background:var(--paper)}
.zoom button{padding:3px 8px;font-weight:700;color:var(--ink-2)}
.zoom button:hover{background:var(--hover)}
.zoom span{min-width:42px;text-align:center;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.sync{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.sync:hover{background:var(--hover)}
.sync.err{background:#FFF1E8;color:var(--danger);font-weight:600}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--paper);border:1px solid var(--rule);border-radius:9px;box-shadow:0 10px 30px rgba(10,16,28,.18);min-width:220px;padding:4px;z-index:30}
.menu button{display:block;width:100%;padding:7px 10px;border-radius:6px}
.menu button:hover{background:var(--hover)}
.menu .sep{border-top:1px solid var(--rule);margin:4px 0}

/* ── Projektspalten ── */
.board{flex:1;min-height:0;display:flex;padding:8px;gap:0;overflow-x:auto}
.zoomer{display:flex;flex:1;min-width:0;min-height:0}
.col{display:flex;flex-direction:column;min-width:240px;min-height:0;background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.col.frozen{opacity:.8}
.col-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--rule);box-shadow:inset 0 3px 0 var(--c)}
.col-h .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.25);flex-shrink:0}
.col-h h2{font-size:14px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.col-h .n{font-size:12px;color:var(--ink-3);white-space:nowrap}
.col-b{flex:1;overflow-y:auto;padding:4px 6px 24px}
.icon{width:24px;height:24px;border-radius:5px;display:grid;place-items:center;color:var(--ink-3);flex-shrink:0}
.icon:hover{background:var(--hover);color:var(--ink)}
.split{width:8px;flex-shrink:0;cursor:col-resize;position:relative}
.split::after{content:"";position:absolute;left:3px;top:40%;bottom:40%;width:2px;border-radius:1px;background:var(--rule-2)}
.split:hover::after,.split.drag::after{background:var(--ink-3);top:10%;bottom:10%}
.sec-h{display:flex;align-items:center;gap:6px;padding:8px 4px 2px;font-size:11.5px;font-weight:700;color:var(--ink-3);letter-spacing:.2px}
.sec-h .c{font-weight:400}
.sec-h .add{margin-left:auto;padding:0 6px;border-radius:4px;font-size:14px;line-height:18px;color:var(--ink-3)}
.sec-h .add:hover{background:var(--hover);color:var(--ink)}
.add-in{width:100%;margin:2px 0 4px;padding:4px 8px;border:1px solid var(--ink);border-radius:6px}
.add-in:focus{outline:none}
.empty{padding:6px 6px;color:var(--ink-4);font-size:12px}

/* Task-Zeile als festes Raster: Kaestchen | Titel (+ Statuszeile) | rechte Spalte (Prioritaet, Element, Notizen) */
.t{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:7px;align-items:start;padding:4px 5px;border-radius:5px;margin-top:1px}
.t:hover{background:var(--hover)}
.t.sel{background:var(--sel)}
.t.focus{box-shadow:inset 3px 0 0 var(--c);background:#F3F5F8;padding-left:8px}
.cb{width:16px;height:16px;margin-top:1px;border:1.5px solid var(--ink-4);border-radius:4px;display:grid;place-items:center;background:var(--paper);padding:0}
.cb:hover{border-color:var(--ink)}
.cb svg{width:12px;height:12px;display:block}
.cb.s-in_progress{background:var(--prog);border-color:var(--prog)}
.cb.s-blocked{background:#D9DDE3;border-color:var(--ink-3)}
.cb.s-done{background:var(--done);border-color:var(--done)}
.cb.r{width:14px;height:14px;border-radius:50%;margin-top:2px}
.cb.r svg{width:10px;height:10px}
.tm{min-width:0;line-height:1.35}
.tt{display:inline;text-align:left;overflow-wrap:anywhere;padding:0;font-weight:600}
.tt:hover{text-decoration:underline;text-decoration-color:var(--ink-4);text-underline-offset:2px}
.t.blocked .tt{color:var(--ink-2)}
.star{display:inline-block;width:12px;height:12px;vertical-align:-1px;margin-right:3px}
.sl{display:flex;gap:4px;align-items:flex-start;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.sl svg{width:11px;height:11px;flex-shrink:0;margin-top:2px}
.sl.prog{color:var(--prog-ink);font-weight:600}
.sl.block{color:var(--ink-2);font-style:italic}
.rc{display:flex;gap:5px;align-items:center;justify-content:flex-end;height:18px}
.chip{display:inline-flex;align-items:center;gap:4px;height:17px;font-size:11px;padding:0 6px 0 0;border:1px solid var(--rule-2);border-radius:4px;color:var(--ink-2);background:var(--paper);overflow:hidden;max-width:118px}
.chip i{width:3px;align-self:stretch;background:var(--c);flex-shrink:0}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:hover{border-color:var(--ink)}
.notes{width:16px;height:16px;display:grid;place-items:center;color:var(--ink-4);border-radius:3px;padding:0}
.notes:hover{color:var(--ink);background:var(--rule)}
.notes svg{width:12px;height:12px}
.prio{display:inline-flex;align-items:flex-end;gap:2px;height:12px;width:13px}
.prio b{width:3px;background:var(--rule-2);border-radius:1px}
.prio b:nth-child(1){height:5px}.prio b:nth-child(2){height:8.5px}.prio b:nth-child(3){height:12px}
.prio b.on{background:var(--ink)}
.subs{margin:0 0 4px 12px;padding-left:12px}
.s{position:relative;display:grid;grid-template-columns:14px minmax(0,1fr) auto;column-gap:6px;align-items:start;padding:2px 5px;border-radius:4px;font-size:12.5px;color:var(--ink-2)}
.s .tt{font-weight:400}
.s::before{content:"";position:absolute;left:-12px;top:0;bottom:0;width:1.5px;background:var(--rule-2)}
.s:last-child::before{bottom:auto;height:11px}
.s::after{content:"";position:absolute;left:-12px;top:10px;width:9px;height:1.5px;background:var(--rule-2)}
.s:hover{background:var(--hover)}
.s.sel{background:var(--sel)}
.s.done .tt{color:var(--ink-4);text-decoration:line-through}
.s.fstep .tt{font-weight:700;color:var(--ink)}
.s.hidden-n{display:block;font-size:11.5px;font-style:italic;color:var(--ink-4)}
.idea{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:7px;align-items:start;padding:3px 5px;border-radius:5px}
.idea:hover{background:var(--hover)}
.idea.sel{background:var(--sel)}
.idea .ic{display:grid;place-items:center;color:var(--ink-3);height:18px}
.idea .ic svg{width:11px;height:11px}
.idea .tt{font-weight:400}
/* Eingeklappte Spalte: schmaler Streifen, Klick klappt auf */
.strip{flex:0 0 36px;width:36px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0;background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:inset 0 3px 0 var(--c);cursor:pointer}
.strip:hover{border-color:var(--ink-3)}
.strip .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.strip b{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;white-space:nowrap}
.strip small{font-size:11px;color:var(--ink-3);writing-mode:vertical-rl;transform:rotate(180deg)}
/* Ein-Projekt-Modus: Lab | General | Ideas nebeneinander */
.one{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--paper);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.one-b{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));}
.one-b>div{overflow-y:auto;padding:4px 8px 24px;border-left:1px solid var(--rule)}
.one-b>div:first-child{border-left:0}
.tabs{display:inline-flex;gap:2px;flex-wrap:wrap}
.tabs button{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;color:var(--ink-2)}
.tabs button:hover{background:var(--hover)}
.tabs button.on{background:var(--sel);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--c)}
.tabs .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
/* Board + Journal (nachrangige Seiten) */
.grp-h{font-size:12px;font-weight:700;color:var(--ink-2);padding:8px 4px 3px;display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:0 6px;border-radius:999px;border:1px solid rgba(0,0,0,.15);white-space:nowrap}
.el{display:flex;width:100%;border-radius:6px;overflow:hidden;margin:2px 0;border:1px solid var(--rule)}
.el:hover{border-color:var(--ink-3)}
.el i{width:4px;background:var(--c);flex-shrink:0}
.el div{padding:4px 8px;min-width:0}
.el b{display:block;font-weight:600;overflow-wrap:anywhere}
.el small{display:block;color:var(--ink-3);font-size:11.5px;overflow-wrap:anywhere}
.jd{display:flex;gap:8px;width:100%;padding:4px;border-radius:6px}
.jd:hover{background:var(--hover)}
.jd .d{width:52px;flex-shrink:0;font-weight:600;font-variant-numeric:tabular-nums}
.jd .x{flex:1;min-width:0;color:var(--ink-2);font-size:12px}
.jd .x div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Schublade (Details auf Abruf) ── */
.scrim{position:fixed;inset:0;background:rgba(15,22,36,.22);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,94vw);background:var(--paper);z-index:41;box-shadow:-12px 0 40px rgba(10,16,28,.18);display:flex;flex-direction:column}
.dr-h{display:flex;gap:8px;align-items:flex-start;padding:12px 14px 8px;border-bottom:1px solid var(--rule)}
.dr-h .k{font-size:12px;color:var(--ink-3)}
.dr-b{flex:1;overflow-y:auto;padding:10px 14px 40px}
.dr-x{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3);font-size:14px;flex-shrink:0}
.dr-x:hover{background:var(--hover);color:var(--ink)}
.ttl{display:block;width:100%;font:700 16px/1.3 var(--ui);border:1px solid transparent;border-radius:6px;padding:3px 6px;margin:0 -7px;resize:none;overflow:hidden;background:transparent;width:calc(100% + 14px)}
.ttl:hover{border-color:var(--rule)}
.ttl:focus{outline:none;border-color:var(--ink)}
.ttl[readonly]{border-color:transparent;cursor:default}
.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;align-items:center;margin:10px 0}
.kv>span{color:var(--ink-3);font-size:12px}
.kv>div{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:0}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{padding:3px 8px;font-size:12.5px;border-left:1px solid var(--rule)}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--hover)}
.seg button.on{background:var(--ink);color:#fff}
.lbtn{font-size:12.5px;color:var(--ink-2);padding:2px 6px;border-radius:5px}
.lbtn:hover{background:var(--hover);color:var(--ink)}
.lbtn.danger{color:var(--danger)}
.btn{display:inline-flex;gap:6px;align-items:center;padding:5px 11px;border-radius:6px;border:1px solid var(--rule-2);background:var(--paper);font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:var(--danger);border-color:#E4B9A3}
.btn[disabled]{opacity:.5;cursor:default}
.dsec{margin-top:16px}
.dsec h3{font-size:12.5px;font-weight:700;color:var(--ink-2);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.dsec h3 .lbtn{margin-left:auto;font-weight:400}
.inl{width:100%;padding:4px 8px;border:1px solid var(--rule-2);border-radius:6px}
.inl:focus{outline:none;border-color:var(--ink)}
.edit textarea{display:block;width:100%;min-height:140px;padding:8px 10px;border:1px solid var(--ink);border-radius:6px;font:13px/1.5 var(--mono);resize:vertical}
.edit textarea:focus{outline:none}
.edit .bar{display:flex;gap:6px;align-items:center;margin-top:6px}
.edit .bar small{margin-left:auto;color:var(--ink-3)}
.md-empty{display:block;width:100%;padding:8px 10px;border:1px dashed var(--rule-2);border-radius:6px;color:var(--ink-3)}
.md-empty:hover{border-color:var(--ink-3);color:var(--ink)}
.stamp{margin-top:18px;font-size:11.5px;color:var(--ink-3)}
.dz{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap}
.logi{padding:8px 0;border-top:1px solid var(--rule)}
.logi:first-child{border-top:0}
.logi small{display:block;color:var(--ink-3);font-size:11.5px;margin-bottom:2px}
.ro{font-size:11.5px;color:var(--ink-3);margin-top:2px}

/* Markdown */
.md{font:14.5px/1.55 var(--read);color:#1D2533;overflow-wrap:anywhere}
.md>*+*{margin-top:.6em}
.md h3,.md h4,.md h5,.md h6{font-family:var(--ui);font-weight:700;line-height:1.3;margin-top:1em}
.md h3{font-size:15.5px}.md h4{font-size:14.5px}.md h5,.md h6{font-size:13.5px}
.md strong{font-weight:700}
.md code{font:12.5px var(--mono);background:#EEF1F5;border:1px solid #DEE3EA;border-radius:4px;padding:0 3px}
.md pre{background:#F2F4F7;border:1px solid var(--rule);border-radius:6px;padding:8px;overflow-x:auto}
.md pre code{background:none;border:0;padding:0;white-space:pre}
.md ul,.md ol{padding-left:1.3em}
.md blockquote{border-left:3px solid var(--rule-2);padding-left:10px;color:var(--ink-2)}
.md .tbl{overflow-x:auto;border:1px solid var(--rule);border-radius:6px}
.md table{border-collapse:collapse;font:12.5px/1.4 var(--ui);width:100%}
.md th,.md td{border-bottom:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
.md th{background:#F5F6F8;font-weight:600}
.md a{color:#0B4F8A}

/* Dialoge + Toast */
.dscrim{position:fixed;inset:0;background:rgba(15,22,36,.4);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px;z-index:60;overflow-y:auto}
.dlg{background:var(--paper);border-radius:12px;width:100%;max-width:460px;padding:18px 20px;box-shadow:0 24px 64px rgba(10,16,28,.3)}
.dlg.wide{max-width:600px}
.dlg h2{font-size:16px;font-weight:700;margin-bottom:6px}
.dlg p{color:var(--ink-2);line-height:1.5}
.dlg p+p{margin-top:6px}
.fld{margin-top:12px}
.fld label,.fld .k{display:block;font-weight:600;margin-bottom:5px}
.fld input{width:100%;padding:6px 9px;border:1px solid var(--rule-2);border-radius:6px}
.fld input:focus{outline:none;border-color:var(--ink)}
.fld .err{color:var(--danger);font-size:12px;margin-top:4px}
.fld .help{color:var(--ink-3);font-size:12px;margin-top:5px;line-height:1.45}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.acts .l{margin-right:auto}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;width:54px;padding:3px 0;border-radius:7px;font-size:11.5px;color:var(--ink-2)}
.sw:hover{background:var(--hover)}
.sw i{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1px rgba(0,0,0,.2);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}
.sw.on{font-weight:700;color:var(--ink)}
.sw.on i{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--ink)}
.choice{display:block;width:100%;padding:8px 12px;border:1px solid var(--rule-2);border-radius:8px;margin-top:8px}
.choice:hover{border-color:var(--ink)}
.choice.danger{color:var(--danger);border-color:#E4B9A3}
.choice small{display:block;color:var(--ink-3);font-weight:400;margin-top:1px}
.pick{max-height:45vh;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;margin-top:8px}
.pick button{display:flex;gap:8px;align-items:center;width:100%;padding:6px 10px;border-top:1px solid var(--rule)}
.pick button:first-child{border-top:0}
.pick button:hover{background:var(--hover)}
.hl{padding-left:18px;line-height:1.55;color:var(--ink-2)}
.hl li+li{margin-top:5px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:9px;padding:8px 12px;display:flex;gap:12px;align-items:center;z-index:70;max-width:min(560px,92vw);box-shadow:0 10px 30px rgba(10,16,28,.3)}
.toast.err{background:#5A1F00}
.toast button{color:#F0E442;font-weight:600}
.nodata{margin:auto;max-width:460px;text-align:center;color:var(--ink-2);line-height:1.6;padding:30px}

/* ── Feinschliff (19.10.2026): eine Hoehe fuer alle Bedienelemente oben, feste Raster in den Zeilen ── */
.top{gap:10px;padding:0 12px;height:46px;flex-wrap:nowrap}
.top .brand{font-size:14.5px;font-weight:700;letter-spacing:.1px;margin-right:2px}
.top .seg,.top .tbtn,.top .zoom,.top .sync,.top .search input,.top .icon{height:28px}
.top .seg button{height:26px;padding:0 10px;font-size:12.5px}
.top .tbtn{display:inline-flex;align-items:center;padding:0 10px;font-size:12.5px}
.top .search input{width:200px;padding:0 26px 0 9px;font-size:12.5px}
.top .search button{top:5px}

/* Abschnittskoepfe (Lab / General / Ideas): groesser als die Eintraege, als Band ueber die volle Spaltenbreite,

.sec-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:14px -8px 4px;padding:7px 10px 7px 12px;background:#EDF0F4;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:14.5px;font-weight:700;color:var(--ink);letter-spacing:0}

.sec-h .add:hover{border-color:var(--ink);color:var(--ink)}
.col-h h2{font-size:15.5px}
/* Duenne Linie zwischen den Top-Level-Tasks (nicht zwischen Subtasks); nicht direkt unter einer Abschnittsueberschrift */
.t{position:relative;margin-top:7px}
.t::before{content:"";position:absolute;left:-8px;right:-8px;top:-4px;border-top:1px solid var(--rule)}
/* Ganzzahlige Zeilenhoehen: sonst liegen die 1-px-Linien auf Bruchteil-Pixeln und wirken mal duenn, mal dick */

<body>
<div id="app"></div>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════════
// 1. HILFSFUNKTIONEN
// ════════════════════════════════════════════════════════════════════════════
function _uid(prefix){return (prefix||'id')+'_'+crypto.randomUUID().replace(/-/g,'').slice(0,12);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function clone(o){return JSON.parse(JSON.stringify(o));}
function nowIso(){return new Date().toISOString();}
function fmtDate(iso,o){if(!iso)return '';const d=new Date(String(iso).length===10?iso+'T12:00:00':iso);return isNaN(d)?String(iso):d.toLocaleDateString('en-GB',o||{day:'numeric',month:'short',year:'numeric'});}
function fmtDT(iso){if(!iso)return '';const d=new Date(iso);return isNaN(d)?String(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});}
function snip(s,n){s=String(s||'').replace(/```[\s\S]*?```/g,' ').replace(/[#*_`>|~]+/g,' ').replace(/\s+/g,' ').trim();return n&&s.length>n?s.slice(0,n-1)+'…':s;}
function plural(n,w){return n+' '+w+(n===1?'':'s');}
function lsGet(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v!=null?v:d;}catch{return d;}}
function lsSet(k,v){try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true;}catch(e){console.error(e);toast('This browser could not store data ('+(e.name||'error')+').','err');return false;}}
// cap = Anfragen/Minute insgesamt; wcap/wcapH = Schreibvorgaenge pro Minute/Stunde (GitHub begrenzt inhalterzeugende Anfragen gesondert)
const T=Object.assign({poll:10000,push:2000,cap:60,wcap:8,wcapH:150,burst:10000},window.__RG_TIMING||{}); // Taktung; Tests duerfen sie verkuerzen

// ════════════════════════════════════════════════════════════════════════════
// 2. KONSTANTEN (Datenvertrag wie overview.html)
// ════════════════════════════════════════════════════════════════════════════
const KEYS=['nodes','elements','tags','statuses','todos','journal','ideas'];
const DEF_ST={planned:{label:'planned',icon:'○',color:'#9e9e9e;#000'},in_progress:{label:'in progress',icon:'⟳',color:'#E69F00;#000'},done:{label:'done',icon:'✓',color:'#0072B2;#fff'},abandoned:{label:'abandoned',icon:'✕',color:'#e2e8f0;#334155'}};
const OLD_ST={planned:'#e9d5ff;#4c1d95',in_progress:'#fed7aa;#7c2d12',done:'#bfdbfe;#1e3a8a'};
const PROJ_COLOR_NAMES={'#d00000':'Red','#00b050':'Green','#0050ff':'Blue','#ffd800':'Yellow','#505050':'Grey','#000000':'Black'};
const PROJ_COLORS=Object.keys(PROJ_COLOR_NAMES);
const SI={open:'<svg class="si" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  in_progress:'<svg class="si" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="6" cy="6" r="2" fill="currentColor"/></svg>',
  blocked:'<svg class="si" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.5 8.5l5-5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  done:'<svg class="si" viewBox="0 0 12 12" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3.6 6.2l1.6 1.6 3.3-3.6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const TODO_ST=[['open','open','Open'],['in_progress','in_progress','In progress'],['blocked','blocked','Blocked'],['done','done','Done']];
const STEP_ST=[['open','open','Open'],['in_progress','in_progress','In progress'],['done','done','Done']];
const CYCLE={open:'in_progress',in_progress:'done',done:'open',blocked:'open'};
const PRIOS=[['low','Low'],['medium','Medium'],['high','High']];
const PRANK={high:0,medium:1,low:2};
// Gezeichnete Symbole (gleich gross, unabhaengig von der Schrift). Form traegt die Bedeutung: leer / Punkt / Strich / Haken.
const CB_ICON={open:'',
  in_progress:'<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="2.7" fill="#000"/></svg>',
  blocked:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.6 9.4l6.8-6.8" stroke="#172033" stroke-width="2" stroke-linecap="round"/></svg>',
  done:'<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.3 6.4l2.4 2.4 5-5.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
const IC_COLLAPSE='<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 3.5L5 7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 3v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const IC_SOLO='<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M8.5 2.5h3v3M5.5 11.5h-3v-3M11.5 2.5L8 6M2.5 11.5L6 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const IC_MORE='<svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="3" cy="7" r="1.3" fill="currentColor"/><circle cx="7" cy="7" r="1.3" fill="currentColor"/><circle cx="11" cy="7" r="1.3" fill="currentColor"/></svg>';
const IC_NOTES='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 3h8M2 6h8M2 9h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const IC_STAR='<svg class="star" viewBox="0 0 12 12" aria-label="Focus"><path d="M6 .8l1.55 3.25 3.55.45-2.6 2.45.68 3.5L6 8.75 2.82 10.45l.68-3.5L.9 4.5l3.55-.45z" fill="#172033"/></svg>';
const IC_IDEA='<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1l1.3 3.7L11 6 7.3 7.3 6 11 4.7 7.3 1 6l3.7-1.3z" fill="currentColor"/></svg>';
const IC_PROG='<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.5" fill="#E69F00" stroke="#7A4100" stroke-width="1"/><circle cx="6" cy="6" r="1.8" fill="#000"/></svg>';
const IC_BLOCK='<svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.9 9.1l6.2-6.2" stroke="currentColor" stroke-width="1.5"/></svg>';

// ════════════════════════════════════════════════════════════════════════════
// 3. MARKDOWN (Agenten schreiben Markdown) — erst escapen, dann formatieren
// ════════════════════════════════════════════════════════════════════════════
const MD_LIST=/^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;
const MD_SEP={test:l=>l.includes('|')&&/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(l)};
function mdInline(text){
  const slots=[];const put=h=>'\u0000'+(slots.push(h)-1)+'\u0000';
  let s=String(text);
  s=s.replace(/`([^`\n]+)`/g,(m,c)=>put('<code>'+esc(c)+'</code>'));
  s=s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,(m,t,u)=>put('<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(t)+'</a>'));
  s=s.replace(/https?:\/\/[^\s<>()]+[^\s<>().,;:!?'"]/g,u=>put('<a href="'+esc(u)+'" target="_blank" rel="noopener noreferrer">'+esc(u)+'</a>'));
  s=esc(s);
  s=s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?!\*)/g,'$1<em>$2</em>');
  s=s.replace(/(^|[^\w])_(?=[^\s_])([^_\n]*?[^\s_])_(?!\w)/g,'$1<em>$2</em>');
  s=s.replace(/~~(?=\S)([^~\n]*?\S)~~/g,'<del>$1</del>');
  return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>slots[+i]);
}
function _row(l){let t=l.trim();if(t.startsWith('|'))t=t.slice(1);if(t.endsWith('|'))t=t.slice(0,-1);const c=[];let cur='',code=false;for(let i=0;i<t.length;i++){const ch=t[i];if(ch==='`')code=!code;if(ch==='|'&&!code){c.push(cur.trim());cur='';continue;}cur+=ch;}c.push(cur.trim());return c;}
function md(src){
  const L=String(src||'').replace(/\r\n?/g,'\n').split('\n');const out=[];let i=0;
  const start=(l,n)=>/^\s*```/.test(l)||/^#{1,6}\s/.test(l)||/^\s*>/.test(l)||MD_LIST.test(l)||/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)||(l.includes('|')&&n!==undefined&&MD_SEP.test(n));
  while(i<L.length){
    const l=L[i];let m;
    if(/^\s*$/.test(l)){i++;continue;}
    if(/^\s*```/.test(l)){const b=[];i++;while(i<L.length&&!/^\s*```\s*$/.test(L[i])){b.push(L[i]);i++;}i++;out.push('<pre><code>'+esc(b.join('\n'))+'</code></pre>');continue;}
    if((m=l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){const h=Math.min(6,m[1].length+2);out.push('<h'+h+'>'+mdInline(m[2])+'</h'+h+'>');i++;continue;}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out.push('<hr>');i++;continue;}
    if(l.includes('|')&&i+1<L.length&&MD_SEP.test(L[i+1])){const head=_row(l);i+=2;const rows=[];while(i<L.length&&L[i].includes('|')&&!/^\s*$/.test(L[i])){rows.push(_row(L[i]));i++;}
      out.push('<div class="tbl"><table><thead><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+head.map((_,k)=>'<td>'+mdInline(r[k]||'')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>');continue;}
    if(/^\s*>/.test(l)){const b=[];while(i<L.length&&/^\s*>/.test(L[i])){b.push(L[i].replace(/^\s*>\s?/,''));i++;}out.push('<blockquote>'+md(b.join('\n'))+'</blockquote>');continue;}
    if(MD_LIST.test(l)){const it=[];while(i<L.length){const lm=L[i].match(MD_LIST);if(lm){it.push({ind:lm[1].replace(/\t/g,'    ').length,ord:/\d/.test(lm[2]),t:lm[3]});i++;continue;}if(/^\s*$/.test(L[i])&&i+1<L.length&&MD_LIST.test(L[i+1])){i++;continue;}if(/^\s+\S/.test(L[i])&&it.length){it[it.length-1].t+='\n'+L[i].trim();i++;continue;}break;}
      let h='';const st=[];for(const x of it){while(st.length&&x.ind<st[st.length-1].ind)h+='</li></'+st.pop().tag+'>';let top=st[st.length-1];if(top&&x.ind===top.ind&&(top.tag==='ol')!==x.ord){h+='</li></'+st.pop().tag+'>';top=st[st.length-1];}if(!top||x.ind>top.ind){const tag=x.ord?'ol':'ul';h+='<'+tag+'>';st.push({ind:x.ind,tag});}else h+='</li>';
        let t=x.t,box='';const bm=t.match(/^\[([ xX])\]\s+/);if(bm){box=bm[1]===' '?'☐ ':'☑ ';t=t.slice(bm[0].length);}h+='<li>'+box+t.split('\n').map(mdInline).join('<br>');}
      while(st.length)h+='</li></'+st.pop().tag+'>';out.push(h);continue;}
    const b=[l];i++;while(i<L.length&&!/^\s*$/.test(L[i])&&!start(L[i],L[i+1])){b.push(L[i]);i++;}
    out.push('<p>'+b.map(mdInline).join('<br>')+'</p>');
  }
  return out.join('');
}

// ════════════════════════════════════════════════════════════════════════════
// 4. DATEN — lokale Kopie in localStorage (Keys wie overview.html), Wahrheit ist der Gist
// ════════════════════════════════════════════════════════════════════════════
const S={projects:[],data:{}};
function _arch(p){const o={};if(p&&p.archived){o.archived=true;o.archivedAt=p.archivedAt||null;}if(p&&p.frozen){o.frozen=true;o.frozenAt=p.frozenAt||null;}return o;} // nur wenn gesetzt
function projById(id){return S.projects.find(p=>p.id===id);}
function liveProjects(){return S.projects.filter(p=>!p.archived);}
function loadProject(pid){
  const pre='rg_'+pid+'_',d={};
  d.nodes=lsGet(pre+'nodes',[]);d.elements=lsGet(pre+'elements',[]);d.tags=lsGet(pre+'tags',{});
  d.statuses=lsGet(pre+'statuses',null)||clone(DEF_ST);
  d.todos=lsGet(pre+'todos',[]);d.journal=lsGet(pre+'journal',[]);d.ideas=lsGet(pre+'ideas',[]);
  return d;
}
function loadLocal(){
  S.projects=lsGet('rg_projects',[]);
  S.data={};S.projects.forEach(p=>{S.data[p.id]=loadProject(p.id);});
}
// Kompletten Stand (Payload-Form) in den lokalen Speicher und in S uebernehmen
function writeLocal(doc){
  const list=doc.projects.map(p=>({id:p.id,name:p.name,color:p.color,created:p.created||nowIso(),..._arch(p)}));
  let ok=true;
  doc.projects.forEach(p=>{const pre='rg_'+p.id+'_';KEYS.forEach(k=>{const v=k==='statuses'?(p.statuses||DEF_ST):k==='tags'?(p.tags||{}):(p[k]||[]);if(!lsSet(pre+k,v))ok=false;});});
  if(!lsSet('rg_projects',list))ok=false;
  S.projects=list;S.data={};
  doc.projects.forEach(p=>{S.data[p.id]={nodes:p.nodes||[],elements:p.elements||[],tags:p.tags||{},statuses:p.statuses||clone(DEF_ST),todos:p.todos||[],journal:p.journal||[],ideas:p.ideas||[]};});
  return ok;
}
function localDoc(){return {projects:S.projects.map(p=>({id:p.id,name:p.name,color:p.color,..._arch(p),...S.data[p.id]}))};}

// ════════════════════════════════════════════════════════════════════════════
// 5. AENDERUNGEN ALS OPERATIONEN — die App schickt nie ihre Gesamtkopie, sondern spielt ihre
//    einzelnen Aenderungen auf den jeweils frischesten GitHub-Stand. Ausstehende Ops ueberleben Reloads.
// ════════════════════════════════════════════════════════════════════════════
let PENDING=lsGet('rg3_pending',[]);
function savePending(){lsSet('rg3_pending',PENDING);}
function _pj(doc,pid){return doc.projects.find(p=>p.id===pid);}
function applyOp(doc,op){
  if(op.t==='proj.add'){if(!_pj(doc,op.meta.id))doc.projects.push({...op.meta,nodes:[],elements:[],tags:{},statuses:clone(DEF_ST),todos:[],journal:[],ideas:[]});return;}
  const p=_pj(doc,op.pid);if(!p)return;
  if(op.t==='proj.set'){Object.entries(op.f).forEach(([k,v])=>{if(v===null)delete p[k];else p[k]=v;});return;}
  if(!Array.isArray(p.todos))p.todos=[];if(!Array.isArray(p.ideas))p.ideas=[];
  const t=op.id?p.todos.find(x=>x.id===op.id):null;
  switch(op.t){
    case 'todo.add':if(!p.todos.some(x=>x.id===op.obj.id))p.todos.push(clone(op.obj));break;
    case 'todo.del':p.todos=p.todos.filter(x=>x.id!==op.id);break;
    case 'todo.set':if(t)Object.entries(op.f).forEach(([k,v])=>{if(v===undefined||v==='\u0000del')delete t[k];else t[k]=v;});break;
    case 'sub.add':{const tt=p.todos.find(x=>x.id===op.tid);if(tt){if(!Array.isArray(tt.subtasks))tt.subtasks=[];if(!tt.subtasks.some(s=>s.id===op.obj.id))tt.subtasks.splice(Math.min(op.at??tt.subtasks.length,tt.subtasks.length),0,clone(op.obj));}break;}
    case 'sub.del':{const tt=p.todos.find(x=>x.id===op.tid);if(tt&&Array.isArray(tt.subtasks))tt.subtasks=tt.subtasks.filter(s=>s.id!==op.sid);break;}
    case 'sub.set':{const tt=p.todos.find(x=>x.id===op.tid);const s=tt&&(tt.subtasks||[]).find(x=>x.id===op.sid);if(s)Object.entries(op.f).forEach(([k,v])=>{if(v==='\u0000del')delete s[k];else s[k]=v;});break;}
    case 'idea.add':if(!p.ideas.some(x=>x.id===op.obj.id))p.ideas.push(clone(op.obj));break;
    case 'idea.set':{const i=p.ideas.find(x=>x.id===op.id);if(i)Object.entries(op.f).forEach(([k,v])=>{if(v==='\u0000del')delete i[k];else i[k]=v;});break;}
  }
}
const _J=v=>JSON.stringify(v);
// Differenz zweier Staende eines Projekts (nur Todos/Subtasks/Ideen) als Op-Liste
function diffProject(pid,before,after){
  const ops=[];
  const bT=new Map((before.todos||[]).map(t=>[t.id,t])),aT=new Map((after.todos||[]).map(t=>[t.id,t]));
  for(const [id,a] of aT){
    const b=bT.get(id);
    if(!b){ops.push({t:'todo.add',pid,obj:a});continue;}
    const f={};
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(k==='subtasks')return;if(_J(a[k])!==_J(b[k]))f[k]=(k in a)?a[k]:'\u0000del';});
    if(Object.keys(f).length)ops.push({t:'todo.set',pid,id,f});
    const bS=new Map((b.subtasks||[]).map(s=>[s.id,s]));const aS=(a.subtasks||[]);
    aS.forEach((s,ix)=>{const o=bS.get(s.id);if(!o){ops.push({t:'sub.add',pid,tid:id,obj:s,at:ix});return;}const sf={};new Set([...Object.keys(s),...Object.keys(o)]).forEach(k=>{if(_J(s[k])!==_J(o[k]))sf[k]=(k in s)?s[k]:'\u0000del';});if(Object.keys(sf).length)ops.push({t:'sub.set',pid,tid:id,sid:s.id,f:sf});});
    const aSid=new Set(aS.map(s=>s.id));(b.subtasks||[]).forEach(s=>{if(!aSid.has(s.id))ops.push({t:'sub.del',pid,tid:id,sid:s.id});});
  }
  for(const id of bT.keys())if(!aT.has(id))ops.push({t:'todo.del',pid,id});
  const bI=new Map((before.ideas||[]).map(i=>[i.id,i]));
  (after.ideas||[]).forEach(a=>{const b=bI.get(a.id);if(!b){ops.push({t:'idea.add',pid,obj:a});return;}const f={};new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(_J(a[k])!==_J(b[k]))f[k]=(k in a)?a[k]:'\u0000del';});if(Object.keys(f).length)ops.push({t:'idea.set',pid,id:a.id,f});});
  return ops;
}
// Rueckgaengig (Strg+Z) / Wiederholen (Strg+Y, Strg+Umschalt+Z), nur diese Sitzung.
// Ein Eintrag haelt die UMKEHR-Ops der Aenderung, nicht einen alten Gesamtstand: angewendet werden sie wie jede
// andere Aenderung auf den aktuellen Stand, also bleibt alles erhalten, was der Agent inzwischen geschrieben hat.
const UNDO=[],REDO=[];let _undoMode=null;
function _record(e){
  if(_undoMode==='undo'){REDO.push(e);return;}
  UNDO.push(e);if(UNDO.length>100)UNDO.shift();
  if(!_undoMode)REDO.length=0;
}
// Jede Aenderung der Nutzerin/des Nutzers laeuft hier durch: lokal anwenden, als Ops merken, Upload planen
function change(pid,fn){
  const d=S.data[pid];if(!d)return 0;
  const before={todos:clone(d.todos),ideas:clone(d.ideas)};
  fn(d);
  const ops=diffProject(pid,before,d);
  if(!ops.length){render();return 0;}
  const inv=clone(diffProject(pid,d,before));
  // Ideen werden nie geloescht: eine neu angelegte Idee nimmt Strg+Z per Archivieren zurueck
  ops.forEach(o=>{if(o.t==='idea.add')inv.push({t:'idea.set',pid,id:o.obj.id,f:{archived:true,archivedAt:nowIso()}});});
  _record({pid,ops:inv});
  PENDING.push(...ops);savePending();
  lsSet('rg_'+pid+'_todos',d.todos);lsSet('rg_'+pid+'_ideas',d.ideas);
  render();schedulePush();
  return ops.length;
}
function changeProject(pid,f){
  const p=projById(pid);if(!p)return;
  const old={};Object.keys(f).forEach(k=>{old[k]=k in p?clone(p[k]):null;});
  _record({pid,proj:old});
  Object.entries(f).forEach(([k,v])=>{if(v===null)delete p[k];else p[k]=v;});
  PENDING.push({t:'proj.set',pid,f});savePending();lsSet('rg_projects',S.projects);render();schedulePush();
}
function addProject(meta){
  S.projects.push(meta);S.data[meta.id]={nodes:[],elements:[],tags:{},statuses:clone(DEF_ST),todos:[],journal:[],ideas:[]};
  _record({pid:meta.id,proj:{archived:true,archivedAt:nowIso()}}); // Projekte werden nie geloescht, nur archiviert
  PENDING.push({t:'proj.add',meta});savePending();lsSet('rg_projects',S.projects);render();schedulePush();
}
function _undoLabel(e){
  if(e.proj)return projById(e.pid)?.name||'';
  const o=e.ops.find(x=>x.t.startsWith('sub'))||e.ops[0];if(!o)return '';
  if(o.t.startsWith('sub'))return (o.obj||findS(e.pid,o.tid,o.sid)||{}).text||'';
  if(o.t.startsWith('todo'))return (o.obj||findT(e.pid,o.id)||{}).text||'';
  return (o.obj||S.data[e.pid]?.ideas.find(x=>x.id===o.id)||{}).title||'';
}
function undoRedo(mode){
  const e=(mode==='undo'?UNDO:REDO).pop();
  if(!e){toast(mode==='undo'?'Nothing to undo.':'Nothing to redo.');return;}
  if(!projById(e.pid)){toast('Could not '+mode+' — the project is gone.');return;}
  const label=snip(_undoLabel(e),60);
  _undoMode=mode;let n=1;
  try{
    if(e.proj)changeProject(e.pid,e.proj);
    else n=change(e.pid,d=>{const doc={projects:[{id:e.pid,todos:d.todos,ideas:d.ideas}]};e.ops.forEach(o=>applyOp(doc,clone(o)));d.todos=doc.projects[0].todos;d.ideas=doc.projects[0].ideas;});
  }finally{_undoMode=null;}
  validateSel();render();
  toast(n?(mode==='undo'?'Undone':'Redone')+(label?': “'+label+'”':'')+(mode==='undo'?' · Ctrl+Y redoes':''):'Nothing changed — it was already changed elsewhere.');
}

// ════════════════════════════════════════════════════════════════════════════
// 6. LIVE-SYNC (Variante A): Gist bleibt Wahrheit.
//    - Abfrage der Revisionsliste mit ETag alle T.poll ms (304 kostet kein Rate-Limit), nur bei sichtbarem Tab
//    - Hochladen = frischen Stand holen + eigene Ops darauf anwenden + PATCH
//    - Reparatur: landet zwischen Lesen und Schreiben eine fremde Revision, wird sie aus der Historie geholt
//      und die eigenen Ops werden erneut darauf angewendet (die Gist-API kennt kein bedingtes Schreiben)
//    - Bremsen (Write-Storm 06.07.2026): hoechstens T.cap Anfragen/Minute, Pause bei 403/429
// ════════════════════════════════════════════════════════════════════════════
let ghToken=localStorage.getItem('rg_gh_token'),ghGistId=localStorage.getItem('rg_gh_gist'),ghUser=localStorage.getItem('rg_gh_user');
let REV=localStorage.getItem('rg3_rev')||null;
let BASE=null; // zuletzt uebernommener GitHub-Stand (ohne eigene Ops) — spart den Download, wenn sich nichts geaendert hat
const SY={state:'idle',msg:'',at:localStorage.getItem('rg_lastSync')||''};
let _inflight=false,_pushT=null,_commitsEtag=null,_pausedUntil=0;
const _reqTimes=[],_wTimes=[];
const GIST_FILE='researchgraph_data.json';
class Halt extends Error{}
function _syncErr(msg){SY.state='error';SY.msg=msg;render();}
async function gh(url,opts){
  const now=Date.now();
  if(now<_pausedUntil)throw new Halt('paused');
  while(_reqTimes.length&&now-_reqTimes[0]>60000)_reqTimes.shift();
  if(_reqTimes.length>=T.cap){_pausedUntil=_reqTimes[0]+60000;throw new Halt('cap');} // harte Obergrenze, egal was der Code will
  const isWrite=opts&&(opts.method==='PATCH'||opts.method==='POST');
  if(isWrite){
    while(_wTimes.length&&now-_wTimes[0]>3600000)_wTimes.shift();
    const lastMin=_wTimes.filter(t=>now-t<60000);
    if(lastMin.length>=T.wcap){_pausedUntil=lastMin[0]+60000;throw new Halt('wcap');}
    if(_wTimes.length>=T.wcapH){_pausedUntil=_wTimes[0]+3600000;_syncErr('Unusually many uploads this hour — sync pauses to protect your GitHub account. Your changes are kept.');throw new Halt('wcapH');}
    _wTimes.push(now);
  }
  _reqTimes.push(now);
  const r=await fetch(url,opts);
  if(r.status===403||r.status===429){
    let ms=0;const ra=r.headers.get('Retry-After');
    if(ra)ms=parseInt(ra,10)*1000;else{const rs=r.headers.get('X-RateLimit-Reset');if(rs)ms=Math.max(0,parseInt(rs,10)*1000-Date.now());}
    if(!ms||isNaN(ms))ms=60000;
    _pausedUntil=Date.now()+ms;
    _syncErr('GitHub asked to slow down — sync pauses for '+Math.ceil(ms/1000)+' s. Your changes are kept.');
    throw new Halt('rate');
  }
  return r;
}
function _auth(){return {Authorization:'Bearer '+ghToken};}
async function _content(d){
  const f=d.files&&d.files[GIST_FILE];if(!f)return null;
  if(!f.truncated)return f.content;
  const rr=await gh(f.raw_url); // raw_url ist revisionsfest und fuer einen secret gist ohne Token lesbar
  if(!rr.ok)throw new Error('could not read the full file from GitHub (HTTP '+rr.status+')');
  const t=await rr.text();
  if(!t.trimEnd().endsWith('}'))throw new Error('the file from GitHub is incomplete');
  return t;
}
async function fetchDoc(version){
  const r=await gh('https://api.github.com/gists/'+ghGistId+(version?'/'+version:''),{headers:_auth()});
  if(!r.ok)throw new Error(r.status===401?'GitHub token expired or invalid — reconnect':'GitHub answered '+r.status);
  const d=await r.json();
  const c=await _content(d);
  if(c==null)return {doc:null,version:null};
  const doc=JSON.parse(c);
  if(!doc||!Array.isArray(doc.projects))throw new Error('the GitHub file has an unexpected format — nothing was changed');
  return {doc,version:version||(d.history&&d.history[0]&&d.history[0].version)||null};
}
function adopt(doc,version){
  BASE=doc;
  const view=clone(doc);
  PENDING.forEach(op=>applyOp(view,op)); // eigene, noch nicht hochgeladene Aenderungen bleiben sichtbar
  writeLocal(view);
  REV=version;if(version)localStorage.setItem('rg3_rev',version);
  if(doc.saved){localStorage.setItem('rg_lastSync',doc.saved);SY.at=doc.saved;}
  validateSel();
  if(SY.state!=='error')SY.state='idle';
  render();
}
async function pull(){
  const {doc,version}=await fetchDoc();
  if(doc)adopt(doc,version);
}
async function _commits(n){
  const r=await gh('https://api.github.com/gists/'+ghGistId+'/commits?per_page='+n,{headers:_auth()});
  if(!r.ok)throw new Error('GitHub answered '+r.status);
  return (await r.json()).map(c=>c.version);
}
function schedulePush(delay){
  if(!ghToken)return;
  clearTimeout(_pushT);

  const now=Date.now(),recent=_wTimes.filter(t=>now-t<60000).length;
  const base=delay??(recent>=Math.ceil(T.wcap/2)?T.burst:T.push);

  _pushT=setTimeout(()=>{push().catch(()=>{});},wait);

}
async function push(){
  if(!ghToken||_inflight||!PENDING.length)return;
  if(!ghGistId){await discoverGist();if(!ghGistId)return createGist();}
  _inflight=true;SY.state='flight';render();
  const sent=PENDING.length,ops=PENDING.slice(0,sent);
  try{
    // Hat sich auf GitHub seit dem letzten Abgleich nichts getan (304 oder gleiche Revision), auf BASE aufsetzen
    let base=null,baseV=null;
    if(BASE&&REV){
      const h=_auth();if(_commitsEtag)h['If-None-Match']=_commitsEtag;
      const cr=await gh('https://api.github.com/gists/'+ghGistId+'/commits?per_page=1',{headers:h});
      if(cr.status===304){base=BASE;baseV=REV;}
      else if(cr.ok){_commitsEtag=cr.headers.get('ETag');const v=(await cr.json())[0]?.version;if(v&&v===REV){base=BASE;baseV=REV;}}
    }
    if(!base){const f=await fetchDoc();base=f.doc;baseV=f.version;}
    if(!base)throw new Error('the GitHub file is missing — nothing was changed');
    let expectPrev=baseV,out=null,myV=null;
    for(let attempt=0;attempt<4;attempt++){
      out=clone(base);ops.forEach(o=>applyOp(out,o));out.saved=nowIso();
      const r=await gh('https://api.github.com/gists/'+ghGistId,{method:'PATCH',headers:{..._auth(),'Content-Type':'application/json'},body:JSON.stringify({files:{[GIST_FILE]:{content:JSON.stringify(out,null,2)}}})});
      if(!r.ok)throw new Error(r.status===401?'GitHub token expired or invalid — reconnect':'upload failed (HTTP '+r.status+')');
      const rd=await r.json();
      myV=rd.history&&rd.history[0]&&rd.history[0].version;
      if(!myV||!expectPrev)break;
      // Pruefen, ob direkt vor unserer Revision die erwartete liegt (die Liste braucht ~1 s, bis sie aktuell ist)
      let list=[],idx=-1;
      for(let k=0;k<4&&idx<0;k++){list=await _commits(5);idx=list.indexOf(myV);if(idx<0)await new Promise(res=>setTimeout(res,700));}
      if(idx<0)break;

      if(!prev||prev===expectPrev)break;

      const f=await fetchDoc(prev);

    if(!(e instanceof Halt)){_syncErr('Upload paused: '+e.message+'. Your changes are kept and retried.');_pausedUntil=Math.max(_pausedUntil,Date.now()+30000);}
  }finally{
    _inflight=false;
    if(PENDING.length)schedulePush(Math.max(T.push,_pausedUntil-Date.now()));
    render();
  }
}
async function poll(force){
  if(!ghToken||!ghGistId||_inflight||Date.now()<_pausedUntil)return;
  if(document.hidden&&!force)return;
  if(PENDING.length){schedulePush();return;} // Upload holt ohnehin den frischen Stand
  try{
    const h=_auth();if(_commitsEtag)h['If-None-Match']=_commitsEtag;
    const r=await gh('https://api.github.com/gists/'+ghGistId+'/commits?per_page=1',{headers:h});
    if(r.status===304)return;
    if(!r.ok)return;
    _commitsEtag=r.headers.get('ETag');
    const v=(await r.json())[0]?.version;
    if(v&&v!==REV&&!PENDING.length&&!_inflight)await pull();
  }catch(e){if(!(e instanceof Halt))console.warn('poll',e);}
}
async function discoverGist(){
  try{
    const r=await gh('https://api.github.com/gists?per_page=100',{headers:_auth()});
    const list=await r.json();
    const f=Array.isArray(list)&&list.find(g=>g.files&&g.files[GIST_FILE]);
    if(f){ghGistId=f.id;localStorage.setItem('rg_gh_gist',ghGistId);}
  }catch(e){}
}
async function createGist(){
  const doc=localDoc();doc.saved=nowIso();
  const r=await gh('https://api.github.com/gists',{method:'POST',headers:{..._auth(),'Content-Type':'application/json'},body:JSON.stringify({description:'ResearchGraph sync',public:false,files:{[GIST_FILE]:{content:JSON.stringify(doc,null,2)}}})});
  if(!r.ok){_syncErr('Could not create the GitHub file (HTTP '+r.status+')');return;}
  const d=await r.json();ghGistId=d.id;localStorage.setItem('rg_gh_gist',ghGistId);

}
async function connect(token){
  const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw new Error(r.status===401?'GitHub did not accept this token. Check that you copied all of it.':'GitHub answered '+r.status+'.');
  const u=await r.json();
  ghToken=token;ghUser=u.login;localStorage.setItem('rg_gh_token',token);localStorage.setItem('rg_gh_user',ghUser);
  if(!ghGistId)await discoverGist();

  else await createGist();
}
function disconnect(){
  ghToken=null;ghUser=null;ghGistId=null;
  ['rg_gh_token','rg_gh_user','rg_gh_gist','rg3_rev'].forEach(k=>localStorage.removeItem(k));
  REV=null;SY.state='idle';SY.msg='';render();
}

// 9. RENDERN: HTML bauen, morph() uebertraegt nur Unterschiede (Fokus, Cursor, Scroll bleiben)

let _mounted=false,_rq=false;
function render(){if(!_mounted||_rq)return;_rq=true;queueMicrotask(()=>{_rq=false;renderNow();});}
function renderNow(){
  const app=document.getElementById('app');

  tpl.innerHTML=renderTop()+renderMain()+renderDrawer()+renderDialog()+renderToast();
  morphKids(app,tpl.content);
  app.querySelectorAll('textarea[data-auto]').forEach(autosize);

}
function morph(a,b){

  const keep=new Set();
  for(const at of b.attributes){keep.add(at.name);if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);}
  for(const at of [...a.attributes])if(!keep.has(at.name))a.removeAttribute(at.name);
  const foc=a===document.activeElement;
  if(a.tagName==='TEXTAREA'){if(!foc&&a.value!==b.value)a.value=b.value;return;}
  if(a.tagName==='INPUT'){if(!foc){const v=b.getAttribute('value')||'';if(a.value!==v)a.value=v;}return;}
  if(a.tagName==='SELECT'){morphKids(a,b);const i=[...b.options].findIndex(o=>o.hasAttribute('selected'));if(i>=0&&a.selectedIndex!==i)a.selectedIndex=i;return;}
  morphKids(a,b);
}
const _k=n=>n.nodeType===1?n.getAttribute('data-k'):null;
function morphKids(a,b){
  const keyed=new Map();for(const n of a.childNodes){const k=_k(n);if(k)keyed.set(k,n);}
  let cur=a.firstChild;
  for(const nb of [...b.childNodes]){
    const k=_k(nb);let m=null;
    if(k){m=keyed.get(k)||null;if(m&&m.nodeName!==nb.nodeName)m=null;if(m)keyed.delete(k);}
    else if(cur&&!_k(cur)&&cur.nodeType===nb.nodeType&&cur.nodeName===nb.nodeName)m=cur;
    if(m){if(m===cur)cur=cur.nextSibling;else a.insertBefore(m,cur);morph(m,nb);}
    else a.insertBefore(nb,cur);
  }
  while(cur){const nx=cur.nextSibling;a.removeChild(cur);cur=nx;}
}

function taskParts(p){

  cats.forEach(c=>{

function boardGroups(p,d){

const FIELDS={
  'todo.text':{req:true,get:([p,i])=>findT(p,i)?.text,set:([p,i],v,d)=>{const t=d.todos.find(x=>x.id===i);t.text=v;t.modifiedAt=nowIso();}},
  'todo.notes':{get:([p,i])=>findT(p,i)?.notes,set:([p,i],v,d)=>{const t=d.todos.find(x=>x.id===i);t.notes=v;t.modifiedAt=nowIso();}},
  'todo.blockedBy':{get:([p,i])=>findT(p,i)?.blockedBy,set:([p,i],v,d)=>{const t=d.todos.find(x=>x.id===i);t.blockedBy=v||null;t.modifiedAt=nowIso();}},
  'step.text':{req:true,get:([p,t,s])=>findS(p,t,s)?.text,set:([p,t,s],v,d)=>{const tt=d.todos.find(x=>x.id===t);tt.subtasks.find(x=>x.id===s).text=v;tt.modifiedAt=nowIso();}},
  'step.notes':{get:([p,t,s])=>findS(p,t,s)?.notes,set:([p,t,s],v,d)=>{const tt=d.todos.find(x=>x.id===t);tt.subtasks.find(x=>x.id===s).notes=v;tt.modifiedAt=nowIso();}},
  'idea.title':{req:true,get:([p,i])=>S.data[p]?.ideas.find(x=>x.id===i)?.title,set:([p,i],v,d)=>{const x=d.ideas.find(y=>y.id===i);x.title=v;x.modifiedAt=nowIso();}},
  'idea.desc':{get:([p,i])=>S.data[p]?.ideas.find(x=>x.id===i)?.desc,set:([p,i],v,d)=>{const x=d.ideas.find(y=>y.id===i);x.desc=v;x.modifiedAt=nowIso();}}
};
function _f(key){const a=key.split('|');const f=FIELDS[a[0]];return f?{f,args:a.slice(1)}:null;}
function exists(key){const a=key.split('|');if(a[0].startsWith('todo'))return !!findT(a[1],a[2]);if(a[0].startsWith('step'))return !!findS(a[1],a[2],a[3]);if(a[0].startsWith('idea'))return !!S.data[a[1]]?.ideas.some(x=>x.id===a[2]);return false;}
function commitTitle(key,raw){
  const x=_f(key);if(!x||!exists(key))return;
  const v=String(raw).replace(/\s*\n\s*/g,' ').trim();
  const cur=String(x.f.get(x.args)||'').trim();
  if(x.f.req&&!v){toast('A title can’t be empty — kept the old one.');render();return;}
  if(v===cur)return;
  change(x.args[0],d=>x.f.set(x.args,v,d));
}
function startEdit(key){commitDraft();const x=_f(key);if(!x)return;const v=String(x.f.get(x.args)||'');ui.edit={key,value:v,orig:v};ui.focusSel='textarea[data-in="draft"]';render();}
function commitDraft(){
  const e=ui.edit;if(!e)return;ui.edit=null;
  const x=_f(e.key);if(!x||!exists(e.key)){render();return;}
  const v=e.value.replace(/\s+$/,'');
  if(v===String(x.f.get(x.args)||'').replace(/\s+$/,'')){render();return;}
  change(x.args[0],d=>x.f.set(x.args,v,d));
}

function setTodoStatus(t,st){
  const now=nowIso(),was=tSt(t);t.status=st;
  if(st==='done'&&was!=='done')t.completedAt=now;
  if(st!=='done')t.completedAt=null;
  if(st!=='blocked')t.blockedBy=null;
  t.modifiedAt=now;
}
function setFocus(d,t,on){
  const now=nowIso();
  if(on)d.todos.forEach(x=>{if((x.focus||x.northStar)&&x!==t){x.focus=false;if('northStar' in x)delete x.northStar;x.modifiedAt=now;}});
  t.focus=!!on;if('northStar' in t)delete t.northStar;

function handleAdd(inp){
  const text=inp.value.trim();if(!text)return;
  const a=inp.dataset,now=nowIso();inp.value='';
  if(a.add==='todo'){const d=S.data[a.pid];change(a.pid,dd=>{dd.todos.push({id:_uid('t'),text,notes:'',status:'open',category:a.cat,order:d.todos.length,subtasks:[],priority:'low',focus:false,dueDate:null,elementId:null,blockedBy:null,completedAt:null,createdAt:now,modifiedAt:now});});}
  else if(a.add==='idea')change(a.pid,dd=>{dd.ideas.push({id:_uid('idea'),title:text,desc:'',elementId:null,createdAt:now});});
  else if(a.add==='step'){const t=findT(a.pid,a.id);if(t)change(a.pid,()=>{if(!Array.isArray(t.subtasks))t.subtasks=[];t.subtasks.push({id:_uid('st'),text,notes:'',status:'open',focus:false,dueDate:null,elementId:null});t.modifiedAt=now;});}
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(ui.menu&&!ev.target.closest('.menu')){ui.menu=null;render();}return;}
  if(el.disabled)return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.dataset.act!=='menu'&&ui.menu&&!el.closest('.menu'))ui.menu=null;
  ev.preventDefault();
  try{const r=fn(el,ev);if(r&&r.catch)r.catch(e=>{console.error(e);toast('Something went wrong: '+e.message,'err');});}
  catch(e){console.error(e);toast('Something went wrong: '+e.message,'err');}
});
document.addEventListener('input',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in;
  if(t.hasAttribute&&t.hasAttribute('data-auto'))autosize(t);
  if(k==='q'){ui.q=t.value;render();}
  else if(k==='draft'){if(ui.edit)ui.edit.value=t.value;}
  else if(k==='dlg'&&ui.dialog){ui.dialog[t.dataset.name]=t.value;if(t.dataset.name==='q')render();}
});
document.addEventListener('change',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in,a=t.dataset||{};
  if(k==='title')commitTitle(a.key,t.value);
  else if(k==='due'){const x=findT(a.pid,a.id);const v=t.value||null;if(x&&(x.dueDate||null)!==v)change(a.pid,()=>{x.dueDate=v;x.modifiedAt=nowIso();});}
  else if(k==='dueStep'){const s=findS(a.pid,a.id,a.sid);const v=t.value||null;if(s&&(s.dueDate||null)!==v)change(a.pid,d=>{s.dueDate=v;d.todos.find(x=>x.id===a.id).modifiedAt=nowIso();});}
});
document.addEventListener('keydown',ev=>{
  const t=ev.target,k=t.dataset&&t.dataset.in,mod=ev.ctrlKey||ev.metaKey;
  if(k==='draft'){if(mod&&ev.key==='Enter'){ev.preventDefault();commitDraft();}else if(ev.key==='Escape'&&ui.edit&&ui.edit.value===ui.edit.orig){ev.preventDefault();ui.edit=null;render();}return;}
  if(k==='title'){if(ev.key==='Enter'){ev.preventDefault();t.blur();}else if(ev.key==='Escape'){ev.preventDefault();const x=_f(t.dataset.key);t.value=x?String(x.f.get(x.args)||''):t.value;t.blur();}return;}
  if(t.dataset&&t.dataset.add){if(ev.key==='Enter'){ev.preventDefault();handleAdd(t);}else if(ev.key==='Escape'){ui.adding=null;t.blur();render();}return;}
  if(ui.dialog){
    if(ev.key==='Escape'){ev.preventDefault();closeDialog();return;}
    if(ev.key==='Enter'&&t.tagName==='INPUT'){ev.preventDefault();const d=ui.dialog;if(d.type==='project')ACT.saveProject();else if(d.type==='sync'&&!ghToken)ACT.connect();else if(d.type==='pick'){const f=document.querySelector('.pick button');if(f)f.click();}}
    return;
  }
  // Strg+Z / Strg+Y (Strg+Umschalt+Z) ueberall — nur in Textfeldern bleibt es das Rueckgaengig des Browsers fuer den Text
  if(mod&&!ev.altKey&&/^[zy]$/i.test(ev.key)){
    if(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)return;
    ev.preventDefault();undoRedo(ev.key.toLowerCase()==='y'||ev.shiftKey?'redo':'undo');return;
  }
  if(ev.key==='Escape'){if(ui.menu){ui.menu=null;render();}else if(ui.drawer){commitDraft();ui.drawer=null;render();}else if(k==='q'){ui.q='';t.blur();render();}return;}
  if(mod&&ev.key.toLowerCase()==='f'){ev.preventDefault();const s=document.querySelector('.search input');if(s){s.focus();s.select();}}
});
// Spaltenbreite ziehen: die linke Spalte bekommt eine feste Breite, der Rest teilt sich den Platz
document.addEventListener('pointerdown',ev=>{
  const sp=ev.target.closest&&ev.target.closest('.split');if(!sp)return;
  const pid=sp.dataset.split;const col=document.querySelector('.col[data-col="'+CSS.escape(pid)+'"]');if(!col)return;
  ev.preventDefault();sp.classList.add('drag');
  const z=ui.zoom/100,startX=ev.clientX,startW=col.getBoundingClientRect().width/z;

  const up=()=>{sp.classList.remove('drag');document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);lsSet('rg3_widths',ui.widths);render();};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
});
