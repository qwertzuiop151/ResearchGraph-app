<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResearchGraph — Dominik Cichos</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  display: flex;
  height: 100vh;
  overflow: hidden;
  background: #f0f2f5;
  color: #222;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 300px;
  min-width: 300px;
  background: #fff;
  border-right: 1px solid #dde1e7;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 2px 0 8px rgba(0,0,0,0.06);
  z-index: 10;
}

#header {
  padding: 14px 16px 12px;
  background: linear-gradient(135deg, #1a237e, #283593);
  color: #fff;
  flex-shrink: 0;
}
#header h1 { font-size: 13px; font-weight: 700; margin-bottom: 2px; letter-spacing: 0.2px; }
#header p  { font-size: 11px; opacity: 0.75; }

#legend {
  padding: 10px 14px;
  border-bottom: 1px solid #eef0f3;
  flex-shrink: 0;
}
#legend h3 {
  font-size: 10px; font-weight: 700; color: #888;
  text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 7px;
}
.leg { display: flex; align-items: center; gap: 7px; margin: 3px 0; font-size: 11.5px; cursor: pointer; padding: 2px 4px; border-radius: 4px; user-select: none; }
.leg:hover { background: #f5f5f5; }
.leg.off { opacity: 0.35; }
.dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
.leg .cnt { margin-left: auto; font-size: 10px; color: #aaa; }

#details {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
}
#details .hint { font-size: 11.5px; color: #bbb; font-style: italic; }
#details h3 { font-size: 13px; font-weight: 700; color: #1a237e; margin-bottom: 5px; }
.badge {
  display: inline-block; font-size: 9.5px; font-weight: 700; padding: 2px 7px;
  border-radius: 10px; color: #fff; margin-bottom: 9px; text-transform: uppercase; letter-spacing: 0.4px;
}
.status-tag {
  display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 8px;
  margin-top: 8px; border: 1px solid currentColor;
}
#details .desc { font-size: 12px; color: #444; line-height: 1.6; }
#details .edges-section { margin-top: 12px; border-top: 1px solid #eee; padding-top: 10px; }
#details .edges-section h4 { font-size: 10.5px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.edge-link { font-size: 11px; color: #1a237e; cursor: pointer; display: block; padding: 2px 0; }
.edge-link:hover { text-decoration: underline; }
.edge-link .elabel { color: #999; font-size: 10px; }

/* ── MAIN CANVAS ── */
#main { flex: 1; position: relative; overflow: hidden; }

svg { width: 100%; height: 100%; cursor: grab; display: block; }
svg.panning { cursor: grabbing; }

/* edges */
.link { stroke: #c8ccd4; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
.link.highlighted { stroke: #7986cb; stroke-width: 2.5; }
.link.faded { opacity: 0.12; }

/* nodes */
.node { cursor: pointer; }
.node circle {
  stroke-width: 2;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.15));
  transition: r 0.15s;
}
.node.selected circle { stroke: #222 !important; stroke-width: 3.5; }
.node.faded circle { opacity: 0.15; }
.node.faded text { opacity: 0.15; }
.node text { pointer-events: none; font-size: 10.5px; text-anchor: middle; fill: #333; font-weight: 500; }

/* edge labels */
.elabel-text { font-size: 9px; fill: #aaa; pointer-events: none; }

/* controls */
#controls {
  position: absolute; bottom: 14px; right: 14px;
  display: flex; flex-direction: column; gap: 4px;
}
.btn {
  width: 30px; height: 30px; background: #fff; border: 1px solid #dde1e7;
  border-radius: 6px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; font-size: 16px; color: #555;
  box-shadow: 0 1px 4px rgba(0,0,0,0.1);
}
.btn:hover { background: #f0f0f0; }

/* search */
#search {
  position: absolute; top: 10px; left: 10px;
  background: #fff; border: 1px solid #dde1e7; border-radius: 20px;
  padding: 5px 12px; font-size: 12px; width: 190px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  outline: none;
}
#search:focus { border-color: #5c6bc0; }

/* stats */
#stats {
  position: absolute; top: 10px; right: 10px;
  background: #fff; border: 1px solid #dde1e7; border-radius: 20px;
  padding: 5px 12px; font-size: 11px; color: #888;
  box-shadow: 0 1px 4px rgba(0,0,0,0.08);
}
</style>
</head>

</div>

<script>

const DATA = {"project":{"title":"Nuclear-Mediated Mitochondrial Transformation via RepA","student":"Dominik Cichos","degree":"Master's Thesis","updated":"2026-03-02"},"nodes":[{"id":"goal","label":"Mitochondrial Transformation","type":"goal","description":"Achieve stable nuclear-mediated mitochondrial genome transformation in plants. The RepA protein from geminiviruses covalently binds ssDNA and, fused to a mitochondrial presequence, should drag exogenous DNA into the mitochondria after nuclear import and export.","status":"in_progress"},{"id":"obs_dna","label":"DNA Import Barrier","type":"obstacle","description":"No established method exists for importing exogenous DNA into plant mitochondria. Only mitoTALEN-based gene editing (Kazama et al. 2019, protein import) has been achieved. DNA transport is the main unsolved problem.","status":"active"},{"id":"obs_selection","label":"No Mito Selection System","type":"obstacle","description":"After transformation, there is no method to select or identify cells containing transformed mitochondria. This fundamentally limits recovery of successful events.","status":"active"},{"id":"strat_poc","label":"PoC: Nuclear Shuttle","type":"strategy","description":"Proof of concept for nuclear import → TEV cleavage → mitochondrial import. Fusion protein RFP–TEVrs–mtPre–mTurquoise2–NES–TEVrs–NLS enters nucleus via NLS, TEV protease cleaves off RFP+NLS, exposing mtPre+NES → mTurquoise2 goes to cytoplasm then mitochondria. RFP stays nuclear.","status":"active"},{"id":"strat_repa","label":"RepA-DNA Transport","type":"strategy","description":"RepA protein from YBDV (Yellow Bean Dwarf Virus) covalently binds ssDNA via a Tyrosine residue at the conserved nonanucleotide sequence. Fused to the TEV-shuttle system (mt-presequence after TEV cleavage), RepA should drag ssDNA cargo into mitochondria.","status":"active"},{"id":"strat_detect","label":"RNA-Editing Detection","type":"strategy","description":"40 random nucleotides inserted between two nad9 homology regions in the DNA cargo. RT-PCR with oDC136/137 primers amplifies the random-nt region from RNA. Sequencing detects known mitochondrial RNA editing sites (C→U at nad9 locus), proving that transcription occurred inside the mitochondria.","status":"active"},{"id":"concept_repa","label":"RepA Protein (YBDV)","type":"concept","description":"RepA is the replication protein of geminiviruses (here: Yellow Bean Dwarf Virus). Its natural function: recognize and cut the conserved nonanucleotide sequence in the viral genome. It covalently binds to the 5' end of ssDNA via a Tyrosine residue. This property is exploited for DNA transport.","status":"active"},{"id":"concept_nad9","label":"nad9 Homology Arms","type":"concept","description":"Nad9 gene (NADH dehydrogenase subunit 9) with ~430 nt upstream region and ~1000 nt downstream region used as homology arms. The mitochondrial genome undergoes constant rearrangement via homologous recombination-like mechanisms, enabling integration of the cargo DNA at the nad9 locus.","status":"active"},{"id":"concept_lir","label":"LIR/SIR (YBDV)","type":"concept","description":"Large Intergenic Region (LIR) and Small Intergenic Region (SIR) from Yellow Bean Dwarf Virus geminivirus. LIR contains the RepA binding nonanucleotide and an alternative CNM-type promoter. Used in DNA cargo constructs so RepA can bind both ends of the ssDNA in inverted repeat configuration.","status":"active"},{"id":"concept_ssDNA","label":"Inverted Repeat ssDNA","type":"concept","description":"The DNA cargo is designed as an inverted repeat (two copies of nad9 flanking regions + random nt in opposite orientation). Each end has a nonanucleotide sequence. RepA binds ssDNA only; the inverted repeat allows formation of a hairpin-like structure.","status":"active"},{"id":"concept_greengate","label":"GreenGate 2.0 / GreenBraid","type":"concept","description":"Modular Golden Gate-based cloning system (Piepers et al. 2023, PLoS One). Uses BsaI/PaqCI restriction sites for scarless multi-fragment assembly. GreenBraid allows stacking of complete expression cassettes. All plant expression vectors were built using this system.","status":"active"},{"id":"pDC011","label":"pDC011","type":"construct","description":"GreenGate plasmid (backbone pMP116). PoC construct module 1. Expression cassette: UBQ10 promoter → RFP(DsRed2) – TEVrs – mt-presequence – mTurquoise2 – NES – TEVrs – SV40 NLS → E9 terminator. Also contains MAS promoter → DAO1 (D-amino acid oxidase). ~11 kb total.","status":"active"},{"id":"pDC012","label":"pDC012","type":"construct","description":"GreenBraid destination vector (backbone pMP117 / pGBZ2). Contains: UBQ10 promoter → mTurquoise2 – TEV-protease (with intron for plant expression) – SGSG linker – SV40 NLS → E9 terminator + MAS promoter → DAO1 → MAS terminator. Note: pDC012-I had 2 missing cytosines in mTurquoise2 (fixed). ~11 kb.","status":"active"},{"id":"pDC045","label":"pDC045","type":"construct","description":"GreenBraid destination vector (pGBY1). Combined inserts from pDC011 + pDC012 assembled via GreenBraid protocol. Contains CaMV 35S promoter → DsRed2. Primary PoC vector for Agrobacterium-mediated plant transformation. T-DNA binary vector. ~15.4 kb.","status":"active"},{"id":"pDC112","label":"pDC112","type":"construct","description":"pDC045 without the NLS–TEVrs–NES cassette. Negative control: tests whether nuclear localization and TEV cleavage are required for mitochondrial routing of mTurquoise2/GFP.","status":"active"},{"id":"pDC113","label":"pDC113","type":"construct","description":"pDC045 without the TEVrs between NES and mt-presequence. Control for the TEV cleavage step: NLS still present but TEV cannot expose mt-presequence.","status":"active"},{"id":"pDC068","label":"pDC068","type":"construct","description":"pDC011 backbone amplified with oDC101+oDC105 to remove GFP/mTurquoise2. RepA protein amplified from pAGT10606 with oDC102+oDC103 and inserted. RepA (no fluorescent tag) intermediate construct.","status":"active"},{"id":"pDC069","label":"pDC069","type":"construct","description":"pDC011 backbone amplified with oDC104+oDC105, retaining GFP. RepA amplified from pAGT10606 and fused to GFP. RepA-GFP fusion for fluorescence tracking of RepA in plant cells.","status":"active"},{"id":"pDC084","label":"pDC084","type":"construct","description":"GreenBraid vector (pGG092). Inserts from pDC068 (RepA no GFP) + pDC012 (TEV + mTurquoise2 + NLS). Full plant expression vector for RepA-based mitochondrial transformation system. No fluorescent RepA tag.","status":"active"},{"id":"pDC085","label":"pDC085","type":"construct","description":"GreenBraid vector (pGG092). Inserts from pDC069 (RepA-GFP) + pDC012 (TEV + mTurquoise2 + NLS). Full plant expression vector for RepA-GFP system. Allows visualization of RepA localization.","status":"active"},{"id":"pDC095","label":"pDC095","type":"construct","description":"pDC068 backbone amplified in two parts. Modified RepA construct (variant 2). Intermediate for assembly of pDC097.","status":"active"},{"id":"pDC097","label":"pDC097","type":"construct","description":"GreenBraid destination vector (pGBY1). Inserts from pDC095 + pDC012. Optimized RepA (no GFP) plant expression vector. Final main transformation vector for RepA-DNA strategy. ~15.9 kb.","status":"active"},{"id":"pDC098","label":"pDC098","type":"construct","description":"GreenBraid destination vector (pGG092). Inserts from pDC096 + pDC012. Optimized RepA-GFP plant expression vector.","status":"active"},{"id":"pDC111","label":"pDC111 (Y-mut RepA)","type":"construct","description":"pDC084 with Tyr→X mutation in RepA active site (two PCRs on pDC084 template). RepA can no longer covalently bind DNA. Critical negative control: if transformation fails with pDC111 but succeeds with pDC084, covalent DNA binding is required.","status":"active"},{"id":"pDC071","label":"pDC071","type":"construct","description":"GreenBraid pGBZ1 destination vector. DNA cargo construct: LIR YBDV (RepA binding site) – CNM-type promoter – nad9 upstream (~430 nt) – 150 nt random sequence – nad9 downstream (~1000 nt) – nonanucleotide. Amplified from pJF1396. No T7 RNA Pol site. Multiple sequenced clones with mutations documented.","status":"active"},{"id":"pDC076","label":"pDC076","type":"construct","description":"GreenBraid pGBZ1. Like pDC071 but with SIR (Small Intergenic Region) instead of LIR. Tests if SIR-based RepA binding is sufficient for DNA transport. Multiple clones with deletions documented in GenBank.","status":"active"},{"id":"pDC079","label":"pDC079","type":"construct","description":"GreenBraid pGBZ1. Like pDC071 but with additional T7 RNA Polymerase binding site upstream of nad9. Allows in vitro transcription to generate ssDNA template. Primary DNA cargo vector for transformation experiments. Multiple sequenced clones with mutations.","status":"active"},{"id":"pDC083","label":"pDC083","type":"construct","description":"GreenBraid pGBZ1. Like pDC079 (LIR + T7 site) but variant 2. Multiple sequenced clones with point mutations and deletions in LIR region documented in GenBank.","status":"active"},{"id":"exp_poc","label":"PoC Fluorescence Exp.","type":"experiment","description":"Agrobacterium-mediated transient transformation of Nicotiana benthamiana leaves. Co-infiltrate: (1) TEV-NLS construct + (2) RFP-mtPre-mTurquoise2 fusion. Expected: RFP in nucleus, mTurquoise2 co-localizing with mitochondria (stained with MitoTracker). Controls: pDC112, pDC113.","status":"planned"},{"id":"exp_transform","label":"RepA Co-transformation","type":"experiment","description":"Agrobacterium-mediated transient or stable transformation. Co-infiltrate: (1) RepA plant vector (pDC097) + (2) DNA cargo vector (pDC079). RepA binds the ssDNA cargo and transports it to mitochondria. Control: pDC111 (Y-mut RepA) as negative control.","status":"planned"},{"id":"exp_rtpcr","label":"RT-PCR Detection","type":"experiment","description":"After transformation: isolate RNA from N. benthamiana. Perform RT-PCR with primer oDC136 (binding random 40 nt) + primer in nad9 region. Amplify transcript only if DNA integrated and is transcribed in mitochondria. Sequence product for C→U RNA editing sites at known nad9 editing positions.","status":"planned"},{"id":"exp_ssdna","label":"ssDNA Cargo Prep","type":"experiment","description":"Generate ssDNA from inverted repeat (pDC079/083) by PCR with one biotinylated primer followed by streptavidin pulldown, or by T7 in vitro transcription followed by reverse transcription. The ssDNA must have nonanucleotide accessible on both ends for RepA binding.","status":"planned"},{"id":"oq_import_eff","label":"Import Efficiency?","type":"open_question","description":"How efficiently does the RepA–ssDNA complex pass through the mitochondrial import machinery alongside the mt-presequence? The covalently bound DNA might be too large or too stiff for efficient co-import. Unknown threshold for success.","status":"open"},{"id":"oq_integration","label":"Stable Integration?","type":"open_question","description":"Will the transported DNA stably integrate into the mitochondrial genome at the nad9 locus? The mitochondrial genome's recombination-like rearrangement may enable this, but efficiency is unknown. Possible: DNA remains as episome or gets degraded.","status":"open"},{"id":"oq_repa_vivo","label":"RepA Activity in Planta?","type":"open_question","description":"Does RepA retain its Tyr-mediated covalent DNA-binding activity in the plant nuclear environment? Does it re-bind the nonanucleotide after nuclear import, and does this bond persist through the cytoplasm into the mitochondrial import machinery?","status":"open"},{"id":"oq_selection","label":"Mito Selection?","type":"open_question","description":"No selection system for transformed mitochondria exists. Even if transformation succeeds, how to identify positive events among thousands of cells? The RT-PCR approach is a detection strategy but not a selection strategy. Future work needed.","status":"open"}],"edges":[{"id":"e1","source":"obs_dna","target":"goal","label":"blocks"},{"id":"e2","source":"obs_selection","target":"goal","label":"blocks"},{"id":"e3","source":"strat_poc","target":"obs_dna","label":"addresses"},{"id":"e4","source":"strat_repa","target":"obs_dna","label":"addresses"},{"id":"e5","source":"strat_detect","target":"obs_selection","label":"partially addresses"},{"id":"e6","source":"strat_poc","target":"strat_repa","label":"prerequisite for"},{"id":"e7","source":"strat_repa","target":"goal","label":"implements"},{"id":"e8","source":"strat_detect","target":"goal","label":"validates"},{"id":"e9","source":"concept_repa","target":"strat_repa","label":"enables"},{"id":"e10","source":"concept_nad9","target":"strat_detect","label":"enables"},{"id":"e11","source":"concept_nad9","target":"strat_repa","label":"integration site"},{"id":"e12","source":"concept_lir","target":"strat_repa","label":"RepA binding"},{"id":"e13","source":"concept_ssDNA","target":"strat_repa","label":"cargo structure"},{"id":"e14","source":"concept_greengate","target":"pDC011","label":"assembled with"},{"id":"e15","source":"concept_greengate","target":"pDC012","label":"assembled with"},{"id":"e16","source":"concept_greengate","target":"pDC045","label":"assembled with"},{"id":"e17","source":"concept_greengate","target":"pDC084","label":"assembled with"},{"id":"e18","source":"concept_greengate","target":"pDC097","label":"assembled with"},{"id":"e19","source":"pDC011","target":"strat_poc","label":"implements"},{"id":"e20","source":"pDC012","target":"strat_poc","label":"implements"},{"id":"e21","source":"pDC045","target":"pDC011","label":"inserts from"},{"id":"e22","source":"pDC045","target":"pDC012","label":"inserts from"},{"id":"e23","source":"pDC112","target":"pDC045","label":"control variant"},{"id":"e24","source":"pDC113","target":"pDC045","label":"control variant"},{"id":"e25","source":"pDC068","target":"pDC011","label":"derived (no GFP)"},{"id":"e26","source":"pDC069","target":"pDC011","label":"derived (+GFP)"},{"id":"e27","source":"pDC084","target":"pDC068","label":"insert from"},{"id":"e28","source":"pDC084","target":"pDC012","label":"insert from"},{"id":"e29","source":"pDC085","target":"pDC069","label":"insert from"},{"id":"e30","source":"pDC085","target":"pDC012","label":"insert from"},{"id":"e31","source":"pDC095","target":"pDC068","label":"modified from"},{"id":"e32","source":"pDC097","target":"pDC095","label":"insert from"},{"id":"e33","source":"pDC097","target":"pDC012","label":"insert from"},{"id":"e34","source":"pDC098","target":"pDC069","label":"derived from"},{"id":"e35","source":"pDC111","target":"pDC084","label":"Tyr-mutant"},{"id":"e36","source":"pDC084","target":"strat_repa","label":"implements"},{"id":"e37","source":"pDC097","target":"strat_repa","label":"implements (final)"},{"id":"e38","source":"concept_lir","target":"pDC071","label":"used in"},{"id":"e39","source":"concept_lir","target":"pDC079","label":"used in"},{"id":"e40","source":"concept_lir","target":"pDC083","label":"used in"},{"id":"e41","source":"concept_nad9","target":"pDC071","label":"used in"},{"id":"e42","source":"concept_nad9","target":"pDC079","label":"used in"},{"id":"e43","source":"pDC076","target":"pDC071","label":"SIR variant"},{"id":"e44","source":"pDC079","target":"pDC071","label":"+T7 variant"},{"id":"e45","source":"pDC083","target":"pDC071","label":"+T7 variant v2"},{"id":"e46","source":"exp_poc","target":"pDC045","label":"uses"},{"id":"e47","source":"exp_poc","target":"pDC112","label":"uses (ctrl)"},{"id":"e48","source":"exp_poc","target":"pDC113","label":"uses (ctrl)"},{"id":"e49","source":"exp_poc","target":"strat_poc","label":"tests"},{"id":"e50","source":"exp_transform","target":"pDC097","label":"uses"},{"id":"e51","source":"exp_transform","target":"pDC079","label":"uses (cargo)"},{"id":"e52","source":"exp_transform","target":"pDC111","label":"uses (neg ctrl)"},{"id":"e53","source":"exp_transform","target":"strat_repa","label":"tests"},{"id":"e54","source":"exp_rtpcr","target":"exp_transform","label":"follows"},{"id":"e55","source":"exp_rtpcr","target":"strat_detect","label":"executes"},{"id":"e56","source":"exp_ssdna","target":"pDC079","label":"uses template"},{"id":"e57","source":"exp_ssdna","target":"concept_ssDNA","label":"implements"},{"id":"e58","source":"exp_ssdna","target":"exp_transform","label":"prepares cargo"},{"id":"e59","source":"oq_import_eff","target":"strat_repa","label":"questions"},{"id":"e60","source":"oq_integration","target":"concept_nad9","label":"questions"},{"id":"e61","source":"oq_repa_vivo","target":"concept_repa","label":"questions"},{"id":"e62","source":"oq_selection","target":"obs_selection","label":"elaborates"},{"id":"e63","source":"concept_repa","target":"pDC068","label":"expressed in"},{"id":"e64","source":"concept_repa","target":"pDC069","label":"expressed in"}]};

// ─────────────────────────────────────────────────────────────────────────────
// CONFIG
// ─────────────────────────────────────────────────────────────────────────────
const TYPE_CFG = {
  goal:          { color: '#1a237e', light: '#e8eaf6', label: 'Ziel',           r: 28 },
  obstacle:      { color: '#b71c1c', light: '#ffebee', label: 'Hindernis',      r: 20 },
  strategy:      { color: '#6a1b9a', light: '#f3e5f5', label: 'Strategie',      r: 24 },
  concept:       { color: '#01579b', light: '#e1f5fe', label: 'Konzept',        r: 20 },
  construct:     { color: '#2e7d32', light: '#e8f5e9', label: 'Konstrukt',      r: 16 },
  experiment:    { color: '#e65100', light: '#fff3e0', label: 'Experiment',     r: 22 },
  result:        { color: '#00695c', light: '#e0f2f1', label: 'Ergebnis',       r: 20 },
  open_question: { color: '#f57f17', light: '#fff8e1', label: 'Offene Frage',   r: 20 },
};

const STATUS_CFG = {
  in_progress: { color: '#1565c0', label: 'laufend'  },
  active:      { color: '#2e7d32', label: 'aktiv'    },
  planned:     { color: '#e65100', label: 'geplant'  },
  open:        { color: '#f57f17', label: 'offen'    },
  abandoned:   { color: '#757575', label: 'verworfen'},
};

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
const nodes = DATA.nodes.map(d => ({ ...d, x: 0, y: 0, vx: 0, vy: 0, pinned: false }));
const edges = DATA.edges;
const nodeMap = Object.fromEntries(nodes.map(n => [n.id, n]));
const hiddenTypes = new Set();
let selectedId = null;
let searchQ = '';

// ─────────────────────────────────────────────────────────────────────────────
// SVG SETUP
// ─────────────────────────────────────────────────────────────────────────────
const svg    = document.getElementById('graph');
const root   = document.getElementById('root');
const edgeG  = document.getElementById('edgeLayer');
const nodeG  = document.getElementById('nodeLayer');

let vx = 0, vy = 0, vScale = 1;

function applyTransform() {
  root.setAttribute('transform', `translate(${vx},${vy}) scale(${vScale})`);
}

// ─────────────────────────────────────────────────────────────────────────────
// INITIAL POSITIONS  (clustered by type)
// ─────────────────────────────────────────────────────────────────────────────
function initPositions() {
  const W = svg.clientWidth || 800;
  const H = svg.clientHeight || 600;
  const cx = W / 2, cy = H / 2;

  const clusters = {
    goal:          [cx, cy - 180],
    obstacle:      [cx + 260, cy - 80],
    strategy:      [cx, cy - 40],
    concept:       [cx - 280, cy + 20],
    construct:     [cx + 60, cy + 160],
    experiment:    [cx - 80, cy + 260],
    result:        [cx + 280, cy + 180],
    open_question: [cx + 200, cy + 300],
  };

  const counts = {};
  nodes.forEach(n => {
    counts[n.type] = (counts[n.type] || 0) + 1;
  });
  const idx = {};

  nodes.forEach(n => {
    idx[n.type] = (idx[n.type] || 0);
    const [bx, by] = clusters[n.type] || [cx, cy];
    const total = counts[n.type];
    const angle = (idx[n.type] / total) * Math.PI * 2;
    const spread = Math.min(120, total * 18);
    n.x = bx + Math.cos(angle) * spread + (Math.random() - 0.5) * 20;
    n.y = by + Math.sin(angle) * spread + (Math.random() - 0.5) * 20;
    idx[n.type]++;
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// FORCE SIMULATION
// ─────────────────────────────────────────────────────────────────────────────
let simRunning = true;
let alpha = 1.0;

function simulate() {
  if (!simRunning || alpha < 0.005) return;

  const W = svg.clientWidth || 800;
  const H = svg.clientHeight || 600;
  const cx = W / 2, cy = H / 2;
  const K_REPEL  = 2800;
  const K_SPRING = 0.04;
  const REST_LEN = 180;
  const GRAVITY  = 0.003 * alpha;
  const DAMP     = 0.82;

  // Reset forces
  nodes.forEach(n => { n.fx = 0; n.fy = 0; });

  // Gravity toward center
  nodes.forEach(n => {
    n.fx += (cx - n.x) * GRAVITY;
    n.fy += (cy - n.y) * GRAVITY;
  });

  // Node repulsion
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      const d2 = dx*dx + dy*dy || 1;
      const d  = Math.sqrt(d2);
      const f  = K_REPEL / d2;
      const fx = f * dx / d, fy = f * dy / d;
      a.fx -= fx; a.fy -= fy;
      b.fx += fx; b.fy += fy;
    }
  }

  // Edge springs
  edges.forEach(e => {
    const s = nodeMap[e.source], t = nodeMap[e.target];
    if (!s || !t) return;
    const dx = t.x - s.x, dy = t.y - s.y;
    const d  = Math.sqrt(dx*dx + dy*dy) || 1;
    const f  = (d - REST_LEN) * K_SPRING;
    const fx = f * dx / d, fy = f * dy / d;
    s.fx += fx; s.fy += fy;
    t.fx -= fx; t.fy -= fy;
  });

  // Integrate
  nodes.forEach(n => {
    if (n.pinned) return;
    n.vx = (n.vx + n.fx) * DAMP;
    n.vy = (n.vy + n.fy) * DAMP;
    n.x += n.vx;
    n.y += n.vy;
  });

  alpha *= 0.994;
  render();
  requestAnimationFrame(simulate);
}

function reheat(a = 0.6) {
  alpha = a;
  if (!simRunning) { simRunning = true; simulate(); }
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
let edgeEls = {}, nodeEls = {};

function buildDOM() {
  // Edges
  edgeG.innerHTML = '';
  edgeEls = {};
  edges.forEach(e => {
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.classList.add('link');
    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.classList.add('elabel-text');
    txt.textContent = e.label || '';
    g.appendChild(path);
    g.appendChild(txt);
    edgeG.appendChild(g);
    edgeEls[e.id] = { g, path, txt };
  });

  // Nodes
  nodeG.innerHTML = '';
  nodeEls = {};
  nodes.forEach(n => {
    const cfg = TYPE_CFG[n.type] || TYPE_CFG.concept;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.classList.add('node');
    g.setAttribute('data-id', n.id);

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('r', cfg.r);
    circle.setAttribute('fill', cfg.light);
    circle.setAttribute('stroke', cfg.color);

    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('dy', '0.35em');

    // Wrap label at ~14 chars
    const words = n.label.split(' ');
    const lines = [];
    let cur = '';
    words.forEach(w => {
      if ((cur + ' ' + w).trim().length > 14 && cur) { lines.push(cur); cur = w; }
      else cur = (cur + ' ' + w).trim();
    });
    if (cur) lines.push(cur);

    if (lines.length === 1) {
      txt.textContent = lines[0];
    } else {
      txt.textContent = '';
      lines.forEach((l, i) => {
        const ts = document.createElementNS('http://www.w3.org/2000/svg', 'tspan');
        ts.setAttribute('x', 0);
        ts.setAttribute('dy', i === 0 ? `${-(lines.length - 1) * 6}px` : '12px');
        ts.textContent = l;
        txt.appendChild(ts);
      });
    }

    g.appendChild(circle);
    g.appendChild(txt);
    nodeG.appendChild(g);
    nodeEls[n.id] = { g, circle };

    // Click
    g.addEventListener('click', () => selectNode(n.id));

    // Drag
    let dragging = false;
    let ox, oy, nx0, ny0;
    g.addEventListener('mousedown', ev => {
      if (ev.button !== 0) return;
      ev.stopPropagation();
      dragging = true;
      ox = ev.clientX; oy = ev.clientY;
      nx0 = n.x; ny0 = n.y;
      n.pinned = true;
      svg.classList.add('panning');
    });
    window.addEventListener('mousemove', ev => {
      if (!dragging) return;
      const dx = (ev.clientX - ox) / vScale;
      const dy = (ev.clientY - oy) / vScale;
      n.x = nx0 + dx; n.y = ny0 + dy;
      n.vx = 0; n.vy = 0;
      reheat(0.3);
    });
    window.addEventListener('mouseup', () => {
      if (dragging) { dragging = false; n.pinned = false; svg.classList.remove('panning'); }
    });
  });
}

function render() {
  // Edge positions
  edges.forEach(e => {
    const el = edgeEls[e.id];
    if (!el) return;
    const s = nodeMap[e.source], t = nodeMap[e.target];
    if (!s || !t) return;

    const dx = t.x - s.x, dy = t.y - s.y;
    const len = Math.sqrt(dx*dx + dy*dy) || 1;
    const tr  = (TYPE_CFG[t.type] || TYPE_CFG.concept).r + 8;
    const ex  = t.x - dx / len * tr;
    const ey  = t.y - dy / len * tr;

    el.path.setAttribute('d', `M${s.x},${s.y} L${ex},${ey}`);
    el.txt.setAttribute('x', (s.x + ex) / 2);
    el.txt.setAttribute('y', (s.y + ey) / 2 - 4);
  });

  // Node positions
  nodes.forEach(n => {
    const el = nodeEls[n.id];
    if (!el) return;
    el.g.setAttribute('transform', `translate(${n.x},${n.y})`);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// VISIBILITY / FILTER
// ─────────────────────────────────────────────────────────────────────────────
function updateVisibility() {
  const q = searchQ.toLowerCase().trim();
  const matchIds = new Set();

  if (q) {
    nodes.forEach(n => {
      if (
        n.label.toLowerCase().includes(q) ||
        (n.description || '').toLowerCase().includes(q) ||
        n.type.toLowerCase().includes(q)
      ) matchIds.add(n.id);
    });
    // also include neighbors of matches
    edges.forEach(e => {
      if (matchIds.has(e.source)) matchIds.add(e.target);
      if (matchIds.has(e.target)) matchIds.add(e.source);
    });
  }

  nodes.forEach(n => {
    const el = nodeEls[n.id];
    if (!el) return;
    const hide = hiddenTypes.has(n.type);
    const fade = q && !matchIds.has(n.id);
    el.g.style.display = hide ? 'none' : '';
    el.g.classList.toggle('faded', !!fade && !hide);
    el.g.classList.toggle('selected', n.id === selectedId);
  });

  edges.forEach(e => {
    const el = edgeEls[e.id];
    if (!el) return;
    const s = nodeMap[e.source], t = nodeMap[e.target];
    const hide = hiddenTypes.has(s?.type) || hiddenTypes.has(t?.type);
    el.g.style.display = hide ? 'none' : '';
    const fade = q && !matchIds.has(e.source) && !matchIds.has(e.target);
    el.path.classList.toggle('faded', !!fade);
    const hi = selectedId && (e.source === selectedId || e.target === selectedId);
    el.path.classList.toggle('highlighted', !!hi);
    el.path.setAttribute('marker-end', hi ? 'url(#arrow-hi)' : 'url(#arrow)');
    el.txt.style.display = hi ? '' : 'none';
  });

  // Stats
  const vis = nodes.filter(n => !hiddenTypes.has(n.type)).length;
  document.getElementById('stats').textContent = `${vis} / ${nodes.length} Knoten`;
}

// ─────────────────────────────────────────────────────────────────────────────
// SELECT NODE
// ─────────────────────────────────────────────────────────────────────────────
function selectNode(id) {
  selectedId = selectedId === id ? null : id;
  updateVisibility();
  renderDetails();
}

function renderDetails() {
  const det = document.getElementById('details');
  if (!selectedId) {
    det.innerHTML = '<p class="hint">Klick auf einen Knoten für Details.</p>';
    return;
  }
  const n = nodeMap[selectedId];
  if (!n) return;
  const cfg  = TYPE_CFG[n.type]  || TYPE_CFG.concept;
  const scfg = STATUS_CFG[n.status] || { color: '#999', label: n.status };

  // Connected edges
  const outEdges = edges.filter(e => e.source === selectedId);
  const inEdges  = edges.filter(e => e.target === selectedId);

  det.innerHTML = `
    <h3>${n.label}</h3>
    <span class="badge" style="background:${cfg.color}">${cfg.label}</span>
    <p class="desc">${n.description || ''}</p>
    <span class="status-tag" style="color:${scfg.color};border-color:${scfg.color}">${scfg.label}</span>
    ${outEdges.length + inEdges.length > 0 ? `
    <div class="edges-section">
      <h4>Verbindungen</h4>
      ${inEdges.map(e => {
        const src = nodeMap[e.source];
        return `<span class="edge-link" onclick="selectNode('${e.source}')">
          ← <em class="elabel">${e.label}</em> ${src?.label || e.source}
        </span>`;
      }).join('')}
      ${outEdges.map(e => {
        const tgt = nodeMap[e.target];
        return `<span class="edge-link" onclick="selectNode('${e.target}')">
          → <em class="elabel">${e.label}</em> ${tgt?.label || e.target}
        </span>`;
      }).join('')}
    </div>` : ''}
  `;
}

// ─────────────────────────────────────────────────────────────────────────────
// LEGEND
// ─────────────────────────────────────────────────────────────────────────────
function buildLegend() {
  const container = document.getElementById('legendItems');
  const counts = {};
  nodes.forEach(n => counts[n.type] = (counts[n.type] || 0) + 1);

  Object.entries(TYPE_CFG).forEach(([type, cfg]) => {
    const div = document.createElement('div');
    div.className = 'leg';
    div.dataset.type = type;
    div.innerHTML = `
      <div class="dot" style="background:${cfg.color}"></div>
      <span>${cfg.label}</span>
      <span class="cnt">${counts[type] || 0}</span>
    `;
    div.addEventListener('click', () => {
      if (hiddenTypes.has(type)) hiddenTypes.delete(type);
      else hiddenTypes.add(type);
      div.classList.toggle('off', hiddenTypes.has(type));
      updateVisibility();
    });
    container.appendChild(div);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// PAN & ZOOM
// ─────────────────────────────────────────────────────────────────────────────
let isPanning = false;
let panStart = { x: 0, y: 0 };
let panOrigin = { x: 0, y: 0 };

svg.addEventListener('mousedown', ev => {
  if (ev.button !== 0 || ev.target.closest('.node')) return;
  isPanning = true;
  panStart  = { x: ev.clientX, y: ev.clientY };
  panOrigin = { x: vx, y: vy };
  svg.classList.add('panning');
});
window.addEventListener('mousemove', ev => {
  if (!isPanning) return;
  vx = panOrigin.x + ev.clientX - panStart.x;
  vy = panOrigin.y + ev.clientY - panStart.y;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  if (isPanning) { isPanning = false; svg.classList.remove('panning'); }
});

svg.addEventListener('wheel', ev => {
  ev.preventDefault();
  const rect  = svg.getBoundingClientRect();
  const mx    = ev.clientX - rect.left;
  const my    = ev.clientY - rect.top;
  const delta = ev.deltaY > 0 ? 0.88 : 1.14;
  vx = mx - (mx - vx) * delta;
  vy = my - (my - vy) * delta;
  vScale *= delta;
  applyTransform();
}, { passive: false });

// Touch zoom/pan
let touches = [];
svg.addEventListener('touchstart', ev => {
  touches = [...ev.touches];
}, { passive: true });
svg.addEventListener('touchmove', ev => {
  ev.preventDefault();
  if (ev.touches.length === 1 && touches.length === 1) {
    const dx = ev.touches[0].clientX - touches[0].clientX;
    const dy = ev.touches[0].clientY - touches[0].clientY;
    vx += dx; vy += dy; applyTransform();
  } else if (ev.touches.length === 2 && touches.length === 2) {
    const d0 = Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
    const d1 = Math.hypot(ev.touches[0].clientX - ev.touches[1].clientX, ev.touches[0].clientY - ev.touches[1].clientY);
    const s  = d1 / d0;
    vScale *= s; applyTransform();
  }
  touches = [...ev.touches];
}, { passive: false });

// Buttons
document.getElementById('btnZoomIn').addEventListener('click', () => {
  const rect = svg.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  vx = cx - (cx - vx) * 1.25; vy = cy - (cy - vy) * 1.25;
  vScale *= 1.25; applyTransform();
});
document.getElementById('btnZoomOut').addEventListener('click', () => {
  const rect = svg.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  vx = cx - (cx - vx) * 0.8; vy = cy - (cy - vy) * 0.8;
  vScale *= 0.8; applyTransform();
});
document.getElementById('btnFit').addEventListener('click', fitView);
document.getElementById('btnReset').addEventListener('click', () => {
  nodes.forEach(n => { n.pinned = false; });
  initPositions();
  fitView();
  reheat(1.0);
});

function fitView() {
  const vis = nodes.filter(n => !hiddenTypes.has(n.type));
  if (!vis.length) return;
  const xs = vis.map(n => n.x), ys = vis.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const rect = svg.getBoundingClientRect();
  const pad  = 60;
  const sx   = (rect.width  - pad * 2) / (maxX - minX || 1);
  const sy   = (rect.height - pad * 2) / (maxY - minY || 1);
  vScale = Math.min(sx, sy, 1.5);
  vx = pad - minX * vScale + (rect.width  - (maxX - minX) * vScale - pad * 2) / 2;
  vy = pad - minY * vScale + (rect.height - (maxY - minY) * vScale - pad * 2) / 2;
  applyTransform();
}

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', ev => {
  searchQ = ev.target.value;
  selectedId = null;
  updateVisibility();
  renderDetails();
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
initPositions();
buildDOM();
buildLegend();

// Center view
const rect0 = svg.getBoundingClientRect();
vx = (rect0.width  || 800) / 2;
vy = (rect0.height || 600) / 2;
applyTransform();

updateVisibility();
simulate();

// After initial sim settles, fit
setTimeout(fitView, 2500);
</script>
</body>
</html>
